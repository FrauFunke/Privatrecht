{id:'m0-s1',title:'Worum geht es? Dein Job im Fachdienst Recht',html:`
<p class="lead">Als Verwaltungsfachangestellte/r bekommst du im Fachdienst Recht Akten mit einer Frage: <i>„Muss die Stadt zahlen?“ – „Ist der Vertrag zustande gekommen?“ – „Kann die Schule den Schlüssel verweigern?“</i> Deine Aufgabe ist es, diese Fragen <b>nachvollziehbar und rechtlich sauber</b> zu beantworten.</p>
<div class="box info"><span class="bt">Das Ziel dieses Kurses</span>Du lernst, ein <b>juristisches Gutachten</b> zu schreiben. Ein Gutachten prüft eine offene Frage Schritt für Schritt – wie ein Navi, das jede Abzweigung begründet, bevor es das Ziel ansagt.</div>

<div class="flow">
<div class="fl"><b>① Sachverhalt erfassen</b>Was ist passiert? Chronologie, Beteiligte, Daten.</div><div class="arrow">→</div>
<div class="fl"><b>② Fallfrage & Obersatz</b>Wer will was von wem woraus?</div><div class="arrow">→</div>
<div class="fl"><b>③ Anspruchsgrundlage</b>Welche Norm gibt das gewünschte Recht?</div><div class="arrow">→</div>
<div class="fl"><b>④ Lösungsskizze</b>Prüfungsreihenfolge mit (+) und (–)</div><div class="arrow">→</div>
<div class="fl"><b>⑤ Gutachten</b>Ausformulieren mit der 4-Schritt-Methode</div></div>
<h2>Das Grundschema jeder Anspruchsprüfung</h2>
<p>Ob jemand etwas verlangen kann, prüfst du immer in drei Stufen. Zunächst steht nur Stufe I im Mittelpunkt – vor allem die Frage, ob ein <b>wirksamer Vertrag</b> zustande gekommen ist.</p>
<div class="grid3">
<div class="card" style="border-top:5px solid var(--s1)"><h3 style="margin-top:0">I. Anspruch entstanden?</h3><p>Sind alle Tatbestandsmerkmale der Anspruchsgrundlage erfüllt (z. B. wirksamer Kaufvertrag)? Gibt es Gründe, die das Entstehen <b>hindern</b> (z. B. fehlende Geschäftsfähigkeit, §§ 104 ff. BGB)?</p></div>
<div class="card" style="border-top:5px solid var(--s2)"><h3 style="margin-top:0">II. Anspruch nicht untergegangen?</h3><p>Der Anspruch darf nicht nachträglich wieder <b>erloschen</b> sein, z. B. durch Erfüllung (§ 362 BGB) oder Anfechtung (§ 142 BGB).</p></div>
<div class="card" style="border-top:5px solid var(--s3)"><h3 style="margin-top:0">III. Anspruch durchsetzbar?</h3><p>Kann der Schuldner die Leistung <b>verweigern</b>, z. B. wegen Verjährung (§ 214 I BGB)?</p></div></div>
<div class="box merke"><span class="bt">Merke</span>Ohne Anspruchsgrundlage keine Prüfung! Ein Anspruch ist nach <span class="norm">§ 194 I BGB</span> das Recht, von einem anderen ein Tun oder Unterlassen zu verlangen.</div>
<div class="w" data-w="m0-flips1"></div>`},

{id:'m0-s2',title:'Rechtsnormen verstehen und zitieren',html:`
<p class="lead">Gesetze bestehen aus Rechtsnormen (Paragrafen bzw. Artikeln). Nicht jede Norm gibt dir einen Anspruch – du musst erkennen, welche Rolle eine Norm im Fall spielt.</p>
<h2>Aufbau einer Rechtsnorm: Wenn – dann</h2>
<p>Fast jede vollständige Rechtsnorm hat zwei Teile: den <b>Tatbestand</b> (die Voraussetzungen) und die <b>Rechtsfolge</b>.</p>
<div class="wenn"><div class="a"><small>Tatbestand = „Wenn …“</small>sich jemand um einen Sitz im Bundestag bewirbt,<div class="mini" style="margin-top:6px">→ enthält die <b>Tatbestandsmerkmale (TBM)</b>, die du einzeln prüfst</div></div><div class="b">⟹</div><div class="c"><small>Rechtsfolge = „… dann“</small>hat er Anspruch auf den zur Vorbereitung seiner Wahl erforderlichen Urlaub.<div class="mini" style="margin-top:6px">→ Anspruch, Befugnis, Gebot oder Verbot</div></div></div>
<p class="mini">Beispiel: Art. 48 I GG</p>
<h3>Kumulativ oder alternativ?</h3>
<div class="grid2"><div class="card"><b>Kumulativ („und“)</b><p>Alle TBM müssen vorliegen. Fehlt <b>ein</b> Merkmal, brichst du die Prüfung ab – die Rechtsfolge tritt nicht ein.</p><div class="tree"><ul><li>TBM 1 <span class="ok">(+)</span></li><li>TBM 2 <span class="no">(–)</span> → Abbruch</li><li><span class="no">Rechtsfolge tritt nicht ein</span></li></ul></div></div>
<div class="card"><b>Alternativ („oder“)</b><p>Es genügt, dass <b>eine</b> der Alternativen vorliegt. Erkennbar an „oder“, Aufzählungen mit Nummern, „Alt.“ bzw. „Var.“.</p><div class="tree"><ul><li>TBM 1 <span class="no">(–)</span> oder</li><li>TBM 2 <span class="ok">(+)</span></li><li><span class="ok">Rechtsfolge tritt ein</span></li></ul></div></div></div>
<h2>Arten von Rechtsnormen</h2>
<table class="t"><tr><th>Art</th><th>Funktion</th><th>Beispiel</th></tr>
<tr><td><b>Anspruchsgrundlage</b><br><span class="tag">vollständig</span></td><td>räumt einer Person das Recht ein, von einer anderen ein Tun oder Unterlassen zu verlangen – und verpflichtet diese zugleich</td><td><span class="norm">§ 433 II BGB</span> (Kaufpreis), <span class="norm">§ 535 II BGB</span> (Miete)</td></tr>
<tr><td><b>Befugnisnorm</b> (Ermächtigungsgrundlage)<br><span class="tag">vollständig</span></td><td>erlaubt der Verwaltung, in Freiheit oder Eigentum von Bürgern einzugreifen – öffentliches Recht</td><td><span class="norm">§ 11 NPOG</span></td></tr>
<tr><td><b>Gebots-/Verbotsnorm</b><br><span class="tag">vollständig</span></td><td>verpflichtet zu einem Handeln oder untersagt ein Verhalten</td><td><span class="norm">§ 1 II StVO</span></td></tr>
<tr><td><b>Hilfsnorm</b><br><span class="tag">unvollständig</span></td><td>erläutert oder ergänzt andere Normen (z. B. Definitionen)</td><td><span class="norm">§ 90 BGB</span> (Sachen), <span class="norm">§ 145 BGB</span> (Antrag)</td></tr>
<tr><td><b>Gegennorm</b><br><span class="tag">unvollständig</span></td><td>verhindert, vernichtet oder hemmt einen Anspruch (Einwendungen/Einreden)</td><td><span class="norm">§ 105 I BGB</span>, <span class="norm">§ 214 I BGB</span></td></tr>
<tr><td><b>Verweisungsnorm</b><br><span class="tag">unvollständig</span></td><td>verweist auf andere Vorschriften, um Wiederholungen zu vermeiden</td><td><span class="norm">§ 480 BGB</span> (Tausch → Kaufrecht)</td></tr></table>
<div class="box achtung"><span class="bt">Typischer Fehler</span>§ 145 BGB (Antrag) oder § 130 BGB (Zugang) sind <b>keine</b> Anspruchsgrundlagen! Sie helfen dir nur, ein Tatbestandsmerkmal (den Vertrag) zu prüfen.</div>
<div class="w" data-w="m0-sort-normen"></div>
<h2>Normen richtig zitieren</h2>
<p>Im Gutachten zitierst du so genau wie möglich – also mit Absatz, Satz, Nummer oder Alternative. Römische Ziffern stehen für Absätze, arabische Ziffern für Sätze.</p>
<table class="t"><tr><th>Ausführlich</th><th>Kurzform (üblich)</th></tr>
<tr><td>§ 433 Absatz 1 Satz 1 BGB</td><td><span class="norm">§ 433 I 1 BGB</span></td></tr>
<tr><td>§ 104 Nummer 1 BGB</td><td><span class="norm">§ 104 Nr. 1 BGB</span></td></tr>
<tr><td>§ 146 1. Alternative BGB</td><td><span class="norm">§ 146 Alt. 1 BGB</span> (auch: Var. 1)</td></tr>
<tr><td>§ 108 Absatz 1 BGB in Verbindung mit § 107 BGB</td><td><span class="norm">§§ 108 I, 107 BGB</span> bzw. <span class="norm">§ 108 I i. V. m. § 107 BGB</span></td></tr>
<tr><td>Artikel 48 Absatz 1 Grundgesetz</td><td><span class="norm">Art. 48 I GG</span></td></tr></table>
<div class="w" data-w="m0-quiz-normen"></div>`},

{id:'m0-s3',title:'Den Fall erfassen: W-Fragen, Obersatz, Lösungsskizze',html:`
<p class="lead">Bevor du prüfst, musst du verstehen, <b>was</b> eigentlich gefragt ist. Dafür nutzt du die W-Fragen. Aus ihnen entsteht der Obersatz – der erste Satz deines Gutachtens.</p>
<h2>Die W-Fragen</h2>
<div class="grid5">
<div class="card" style="text-align:center"><div style="font-size:1.6rem">👤</div><b>Wer?</b><div class="mini">Anspruchsteller</div></div>
<div class="card" style="text-align:center"><div style="font-size:1.6rem">🎯</div><b>Will was?</b><div class="mini">Anspruchsziel, z. B. Zahlung von 150 €</div></div>
<div class="card" style="text-align:center"><div style="font-size:1.6rem">👥</div><b>Von wem?</b><div class="mini">Anspruchsgegner</div></div>
<div class="card" style="text-align:center"><div style="font-size:1.6rem">❓</div><b>Warum?</b><div class="mini">Anlass, z. B. Mietvertrag</div></div>
<div class="card" style="text-align:center"><div style="font-size:1.6rem">§</div><b>Woraus?</b><div class="mini">Anspruchsgrundlage</div></div></div>
<h2>Der Obersatz</h2>
<p>Der Obersatz fasst alle W-Fragen in einem Satz zusammen – im <b>Konjunktiv</b>, weil das Ergebnis noch offen ist.</p>
<div class="box def"><span class="bt">Muster</span><b>[Wer]</b> könnte gegen <b>[von wem]</b> einen Anspruch auf <b>[was]</b> aus <b>[woraus/Norm]</b> haben.</div>
<div class="card"><b>Beispiel:</b> Die Stadt Neustadt hat einem Bürger B ein gebrauchtes Dienstfahrrad für 120 € verkauft. B zahlt nicht.<br>
<span style="color:var(--s1)">→ <i>„Die Stadt Neustadt (N) könnte gegen B einen Anspruch auf Zahlung des Kaufpreises in Höhe von 120 € aus § 433 II BGB haben.“</i></span></div>
<div class="box achtung"><span class="bt">Achtung: Wer will was?</span>Der <b>Verkäufer</b> will den Kaufpreis → <span class="norm">§ 433 II BGB</span>. Der <b>Käufer</b> will die Sache → <span class="norm">§ 433 I 1 BGB</span>. Beim Mietvertrag will der Vermieter die Miete (<span class="norm">§ 535 II BGB</span>), der Mieter die Überlassung der Mietsache (<span class="norm">§ 535 I 1 BGB</span>).</div>
<h2>Die Lösungsskizze</h2>
<p>Die Lösungsskizze ist dein <b>Bauplan</b>: Stichpunkte, Normen und Teilergebnisse mit (+) für „erfüllt“ und (–) für „nicht erfüllt“. Erst danach schreibst du das Gutachten aus.</p>
<div class="grid2"><div class="tree"><b>Lösungsskizze (Grundgerüst Kaufvertrag)</b><ul style="margin-top:8px">
<li>N könnte gegen B Anspruch auf Zahlung von 120 € gem. § 433 II BGB haben.
<ul><li><b>I. Anspruch entstanden?</b><ul><li>Wirksamer Kaufvertrag
<ul><li>Antrag (§ 145 BGB) <span class="ok">(+)</span><ul><li>Abgabe <span class="ok">(+)</span></li><li>Zugang (§ 130 I 1 BGB) <span class="ok">(+)</span></li></ul></li>
<li>Annahme (§§ 146 ff. BGB) <span class="ok">(+)</span><ul><li>Abgabe <span class="ok">(+)</span></li><li>Zugang (§ 130 I 1 BGB) <span class="ok">(+)</span></li></ul></li>
<li><span class="te">TE: Einigung (+)</span></li></ul></li>
<li>Wirksamkeitshindernisse? (z. B. §§ 104 ff. BGB) <span class="no">(–)</span></li></ul></li>
<li><b>II. Anspruch nicht untergegangen?</b> <span class="ok">(+)</span></li><li><b>III. Anspruch durchsetzbar?</b> <span class="ok">(+)</span></li></ul></li>
<li><b>Ergebnis:</b> Anspruch <span class="ok">(+)</span></li></ul></div>
<div><div class="box info" style="margin-top:0"><span class="bt">Abkürzungen</span><b>TBM</b> = Tatbestandsmerkmal<br><b>TE</b> = Teilergebnis<br><b>RF</b> = Rechtsfolge<br><b>(+)</b> = erfüllt · <b>(–)</b> = nicht erfüllt<br><b>WE</b> = Willenserklärung<br><b>KV</b> = Kaufvertrag</div>
<div class="box merke"><span class="bt">Lösungsskizze ≠ Gutachten</span>Die Skizze zeigt die <b>Struktur</b>, das Gutachten liefert die <b>Begründung</b> in ganzen Sätzen. Die Skizze ist deine <b>Vorbereitung</b>: Mit ihr legst du die Prüfungsreihenfolge fest, damit du im Gutachten nichts vergisst und keine Gedankensprünge machst. Deshalb wird nur das <b>Gutachten bewertet</b> – die Lösungsskizze bleibt unbewertet.</div></div></div>
<div class="w" data-w="m0-quiz-obersatz"></div>`},

{id:'m0-s4',title:'Die 4-Schritt-Methode (Subsumtionstechnik)',html:`
<p class="lead">Das Herzstück jedes Gutachtens: Jedes Tatbestandsmerkmal prüfst du in denselben vier Schritten. Wenn du diese Technik beherrschst, kannst du jeden Fall lösen – egal ob Kaufvertrag, Mietvertrag oder verwaltungsrechtliche Fragestellungen.</p>
${STEPS_VISUAL}
<h2>Ein Beispiel Schritt für Schritt</h2>
<div class="card" style="background:#f8fafb"><b>Sachverhalt:</b> Die Stadt Neustadt (N) möchte einen ausgemusterten Dienstwagen verkaufen. Am 10.03. schreibt sie dem Autohaus Krause (K): „Wir bieten Ihnen unseren Dienstwagen VW Golf, amtliches Kennzeichen NEU-S 123, zum Preis von 4.500 € an. Wir freuen uns auf Ihre Rückmeldung.“<br><b>Frage:</b> Ist das Schreiben ein Antrag?</div>
<div class="gut"><div class="ttl">TBM: Antrag (§ 145 BGB)</div>
<div class="row r1"><div class="lab">① TBM + Fallbezug</div><div class="txt">Das Schreiben der N vom 10.03. an K könnte ein Antrag gem. § 145 BGB sein.</div></div>
<div class="row r2"><div class="lab">② Definition</div><div class="txt">Ein Antrag ist eine einseitige empfangsbedürftige WE, mit der eine Seite der anderen mit erkennbarem Rechtsbindungswillen den Abschluss eines Vertrages anbietet. Die WE muss hierfür die vertragswesentlichen Bestandteile enthalten (hier: Vertragspartner, Kaufsache und -preis) und so genau bestimmt sein, dass der Annehmende mit einem schlichten „Ja“ den Vertrag zustande kommen lassen kann.</div></div>
<div class="row r3"><div class="lab">③ Subsumtion</div><div class="txt">N richtet ihr Schreiben gezielt an K und erklärt ausdrücklich: „Wir bieten Ihnen … an.“ Damit ist ihr Wille, sich rechtlich zu binden, für K erkennbar. Das Schreiben nennt die Vertragspartner (N als Verkäuferin, K als Käufer), die Kaufsache (VW Golf, Kennzeichen NEU-S 123) und den Kaufpreis (4.500 €). K müsste also nur noch mit „Ja“ antworten, damit der Kaufvertrag zustande kommt.</div></div>
<div class="row r4"><div class="lab">④ Conclusio</div><div class="txt">Somit liegt ein Antrag der N vom 10.03. vor.</div></div></div>
<div class="box merke"><span class="bt">So erkennst du gute Subsumtion</span>Jedes <b>Element der Definition</b> (erkennbarer Rechtsbindungswille – Vertragspartner – Kaufsache – Kaufpreis – schlichtes „Ja“ genügt) taucht in Schritt 3 wieder auf und wird mit einer <b>konkreten Tatsache</b> aus dem Sachverhalt verbunden.</div>
<h2>Die häufigsten Fehler</h2>
<div class="grid2">
<div class="box achtung" style="margin:0"><span class="bt">Schritt 1</span>Nur „Fraglich ist der Antrag.“ – <b>Fallbezug fehlt</b>. Besser: „M könnte am 24.11. gem. § 145 BGB einen Antrag gemacht haben.“</div>
<div class="box achtung" style="margin:0"><span class="bt">Schritt 2</span>Gesetzestext abgeschrieben statt definiert, oder schon Fakten aus dem Fall in die Definition gemischt.</div>
<div class="box achtung" style="margin:0"><span class="bt">Schritt 3</span>Sachverhalt nur nacherzählt, ohne ihn mit den Elementen der Definition zu verbinden – oder ein Element vergessen.</div>
<div class="box achtung" style="margin:0"><span class="bt">Schritt 4</span>Conclusio fehlt oder passt nicht zu Schritt 1 („… müsste zugegangen sein“ → „… ist zugegangen“).</div></div>
<div class="w" data-w="m0-sort-steps"></div>
<div class="w" data-w="m0-write-zugang"></div>`},

{id:'m0-s5',title:'Gutachtenstil statt Urteilsstil',html:`
<p class="lead">Im Gutachten weißt du am Anfang noch nicht, wie der Fall ausgeht – deshalb denkst du „laut“ und kommst erst am Ende zum Ergebnis. Ein Urteil (z. B. ein Gericht oder dein Vermerk an die Sekretärin) nennt dagegen zuerst das Ergebnis und begründet es danach.</p>
<div class="grid2">
<div class="card" style="border-top:5px solid var(--teal)"><h3 style="margin-top:0">Gutachtenstil</h3><p><b>Frage → Prüfung → Ergebnis</b></p><p><i>„Der Vertrag <b>könnte</b> wirksam sein. <b>Dazu müsste</b> M geschäftsfähig sein. … M ist 17 Jahre alt. <b>Somit</b> ist er beschränkt geschäftsfähig.“</i></p><span class="tag">Konjunktiv</span><span class="tag">„also / somit / folglich“</span><span class="tag">Ergebnis zum Schluss</span></div>
<div class="card" style="border-top:5px solid var(--amber)"><h3 style="margin-top:0">Urteilsstil</h3><p><b>Ergebnis → Begründung</b></p><p><i>„Der Vertrag <b>ist</b> unwirksam, <b>denn</b> M ist mit 17 Jahren beschränkt geschäftsfähig und sein Vater hat die Genehmigung verweigert.“</i></p><span class="tag">Indikativ</span><span class="tag">„denn / weil / da“</span><span class="tag">Ergebnis zuerst</span></div></div>
<h2>Formulierungshilfen</h2>
<table class="t"><tr><th>Schritt</th><th>Formulierungen</th></tr>
<tr><td style="color:var(--s1);font-weight:700;white-space:nowrap">① TBM nennen</td><td>„X könnte … haben.“ · „Dazu müsste …“ · „Weiterhin müsste …“ · „Ferner ist erforderlich, dass …“ · „Fraglich ist, ob …“ (<b>nur</b> bei echten Problemen)</td></tr>
<tr><td style="color:var(--s2);font-weight:700;white-space:nowrap">② Definition</td><td>„Ein Antrag ist …“ · „Unter … versteht man …“ · „Das ist der Fall, wenn …“ · „Voraussetzung dafür ist …“</td></tr>
<tr><td style="color:var(--s3);font-weight:700;white-space:nowrap">③ Subsumtion</td><td>„Hier …“ · „Im vorliegenden Fall …“ · „Laut Sachverhalt …“ · „M hat am … erklärt, dass …“ · „Allerdings …“</td></tr>
<tr><td style="color:var(--s4);font-weight:700;white-space:nowrap">④ Conclusio</td><td>„Somit / Folglich / Also liegt … vor.“ · „Ein Antrag ist damit (nicht) gegeben.“</td></tr></table>
<div class="box info"><span class="bt">Schwerpunkte setzen</span>Nicht jedes Merkmal braucht vier lange Sätze. <b>Unproblematisches</b> („M ist 17 Jahre alt“) darfst du kurz feststellen. <b>Problematisches</b> (z. B. die fehlende Zustimmung des Vaters) prüfst du ausführlich.</div>
<div class="w" data-w="m0-sort-stil"></div>`},

{id:'m0-s6',title:'Abschlusstest, Checkliste & KI-Prompts',html:`
<p class="lead">Teste dein Wissen zur Rechtsanwendung. Ab 70 % gilt der Test als bestanden – du kannst ihn beliebig oft wiederholen. Danach schätzt du dich mit der Checkliste selbst ein.</p>
<div class="w" data-w="m0-quiz-final"></div>
<div class="w" data-w="m0-check"></div>
<div class="w" data-w="m0-prompts"></div>
<div class="box merke"><span class="bt">Nächster Schritt</span>Trage unter <a href="#ziele">Lernziele &amp; Selbsteinschätzung</a> ein, wie sicher du dich fühlst. Dann geht es weiter mit der Lernsituation <a href="#m1-s1">„Theater mit dem Vater“</a>.</div>`}
]};

W['m0-sort-steps']={type:'sort',title:'Welcher Schritt ist das?',intro:'Fall: Händler H bietet der Stadt per E-Mail 20 Bürostühle für je 89 € an. Ordne jeden Satz dem passenden Schritt der 4-Schritt-Methode zu.',
cats:['① TBM + Fallbezug','② Definition','③ Subsumtion','④ Conclusio'],

{t:'„Die E-Mail des H vom 03.11. könnte ein Antrag i. S. d. § 145 BGB sein.“',c:0},
{t:'„Ein Antrag ist eine einseitige empfangsbedürftige WE, mit der eine Seite der anderen mit erkennbarem Rechtsbindungswillen den Abschluss eines Vertrages anbietet. Die WE muss hierfür die vertragswesentlichen Bestandteile enthalten (hier: Vertragspartner, Kaufsache und -preis) und so genau bestimmt sein, dass der Annehmende mit einem schlichten ‚Ja‘ den Vertrag zustande kommen lassen kann.“',c:1},
{t:'„H benennt in der E-Mail die Vertragsparteien (H und die Stadt), die Ware (20 Bürostühle) und den Preis (89 € je Stuhl).“',c:2},

{t:'„Das ist der Fall, wenn die WE so in den Machtbereich des Empfängers gelangt ist, dass dieser die Möglichkeit der Kenntnisnahme hat und unter normalen Umständen mit der Kenntnisnahme zu rechnen ist.“',c:1},
{t:'„Folglich ist der Antrag am 03.11. zugegangen.“',c:3}]};

W['m0-write-zugang']={type:'write',title:'Übe selbst: Die Annahme des Autohauses',
task:'<p><b>Sachverhalt (Fortsetzung):</b> In ihrem Schreiben vom 10.03. hatte die Stadt Neustadt (N) zusätzlich erklärt: „An dieses Angebot halten wir uns bis zum 20.03. gebunden.“ Am 12.03. antwortet das Autohaus Krause (K) per E-Mail: „Vielen Dank für Ihr Angebot. Wir nehmen es an und kaufen den VW Golf, Kennzeichen NEU-S 123, zum Preis von 4.500 €.“</p><p><b>Aufgabe:</b> Prüfe in den vier Schritten, ob K den Antrag der N angenommen hat.</p>',
hint:'Prüfe in der Subsumtion zwei Punkte ausdrücklich: Stimmt K <b>vorbehaltlos</b> zu – also ohne Änderungen oder Bedingungen? Und erfolgt die Annahme <b>innerhalb der Annahmefrist</b>?',
sol:`<div class="gut"><div class="row r1"><div class="lab">① TBM</div><div class="txt">K könnte den Antrag der N vom 10.03. durch seine E-Mail vom 12.03. gem. §§ 147, 148 BGB angenommen haben.</div></div>
<div class="row r2"><div class="lab">② Definition</div><div class="txt">Eine Annahme ist eine empfangsbedürftige WE, durch die ein Antrag vorbehaltlos innerhalb einer bestimmten Annahmefrist bejaht wird und damit zum Zustandekommen eines Vertrags führt.</div></div>
<div class="row r3"><div class="lab">③ Subsumtion</div><div class="txt"><b>Vorbehaltlose Zustimmung:</b> K erklärt ausdrücklich, das Angebot anzunehmen. Er übernimmt die Kaufsache (VW Golf, Kennzeichen NEU-S 123) und den Kaufpreis (4.500 €) unverändert und knüpft seine Zustimmung weder an Änderungen noch an Bedingungen. Er bejaht den Antrag also vorbehaltlos.<br><b>Annahmefrist:</b> N hat für die Annahme eine Frist bis zum 20.03. bestimmt (§ 148 BGB). K hat seine Annahme bereits am 12.03. per E-Mail erklärt und damit deutlich vor Ablauf der Frist.</div></div>
<div class="row r4"><div class="lab">④ Conclusio</div><div class="txt">Somit liegt eine Annahme des K vom 12.03. vor.</div></div></div>
<div class="box info" style="font-size:.9rem;margin-bottom:0"><span class="bt">Ausblick</span>Damit die Annahme wirksam wird und der Kaufvertrag zustande kommen kann, müsste die Annahme des K der N außerdem zugegangen sein (§ 130 I 1 BGB). Wirksam wird die Annahme, wenn sie zugegangen ist. Wie man den Zugang prüft, lernst du in LS 1.</div>`};

{t:'Obersatz-Trainer',when:'Zum Üben der W-Fragen',p:`Du bist Trainer/in für juristische Fallbearbeitung für Verwaltungsfachangestellte (1. Ausbildungsjahr).

{t:'Feedback zur 4-Schritt-Methode',when:'Nachdem du die Schreibübung „Die Annahme des Autohauses“ gelöst hast',p:`Du bist Lehrkraft für Zivilrecht an einer Berufsschule. Bewerte meinen Gutachtenabschnitt anhand der 4-Schritt-Methode:

/* ================= INHALTE: MODUL 1 – LS 1 „Theater mit dem Vater“ (Teil A) ================= */
const M1={id:'m1',short:'LS 1 · Theater mit dem Vater',icon:'🎭',title:'Lernsituation 1 · „Theater mit dem Vater“',released:true,
teaser:'Vertragsschluss durch Antrag und Annahme, Zugang von Willenserklärungen, Geschäftsfähigkeit Minderjähriger',
sections:[
{id:'m1-s1',title:'Der Auftrag: Sachverhalt erfassen',html:`
<div class="grid2" style="align-items:start">
<div><p class="lead">Du bist Sachbearbeiterin bzw. Sachbearbeiter im <b>Fachdienst Recht der Stadt Neustadt</b>. Deine Fachdienstleitung legt dir einen Vermerk der Schulsekretärin des Gutenberg-Gymnasiums auf den Tisch – mit der Bitte um Klärung der Rechtslage.</p>
<table class="t"><tr><th>Deine Rolle</th><td>SB im FD Recht</td></tr><tr><th>Auftraggeber</th><td>Fachdienstleitung Recht</td></tr><tr><th>Kunde</th><td>Gutenberg-Gymnasium, Frau Schön</td></tr><tr><th>Arbeitsprodukte</th><td>① Lösungsskizze<br>② Gutachten<br>③ kurze Antwort an Frau Schön</td></tr></table>
<div class="box achtung"><span class="bt">Bearbeitungshinweis</span>Fragen der Stellvertretung (handelt die Sekretärin bzw. der Schulleiter wirksam für die Schule?) musst du <b>nicht</b> prüfen – das kommt in LS 2.</div>
<div class="card" style="display:flex;gap:14px;align-items:center;padding:14px 18px"><div style="font-size:1.8rem">📄</div><div style="flex:1"><b>Fallmaterial zum Herunterladen</b><div class="mini">Lernsituation „Theater mit dem Vater“ mit Vermerk der Schulsekretärin (PDF, 2 Seiten, 90 KB) – für deine Unterlagen</div></div><a class="btn teal" style="text-decoration:none;white-space:nowrap" href="material/LS1_Theater_mit_dem_Vater.pdf" target="_blank" rel="noopener">PDF öffnen ↗</a></div></div>
<div class="doc"><div class="hd"><span>Gutenberg-Gymnasium · AZ: abc</span><span>01.12.20..</span></div>
<b>Anmietung der Aula für das Abi-Varieté</b><br><br><b>1) Vermerk</b><br>
Der Schüler Max Mustermann (17) war vor zwei Wochen, am 10.11.20.., bei uns im Sekretariat und hat sich in seiner Funktion als Jahrgangssprecher nach einer Mietmöglichkeit für die schulische Aula erkundigt. In dieser möchte der aktuelle Abiturjahrgang eine Varieté-Veranstaltung aufführen, deren Einnahmen die Abiturkasse aufbessern sollen, damit der Jahrgang einen unvergesslichen Abiball organisieren kann.<br><br>
Weil ich mir unsicher war, ob ich das zusagen darf, habe ich Max mitgeteilt, dass ich ihm die Nutzung nicht zusagen kann und erst mit dem Schulleiter sprechen muss.<br><br>
Nach Rücksprache mit der Schulleitung habe ich Max zu einem Gespräch am 24.11.20.. eingeladen und ihm hierbei den schulischen Mietvertrag vorgelegt. Max entstehen durch den Vertrag keine Kosten, er muss aber natürlich für hoffentlich nicht entstehende Schäden aufkommen. Max hat mir erklärt, dass er damit einverstanden sei, denn der Jahrgang habe ihm zugesichert, dass alle eventuellen Kosten aus der Jahrgangskasse bezahlt werden würden. Unter anderem zahlt der Jahrgang auch die Miete von 150,00 €. Nach dem kurzen Gespräch hat Max dann den Vertrag unterschrieben, der vorab schon vom Schulleiter unterzeichnet wurde.<br><br>
Heute besuchte mich dann der Vater von Max, Hubert Mustermann, im Büro und beschwerte sich darüber, dass wir seinem Sohn einen „fiesen Knebelvertrag untergejubelt“ hätten. Ich habe ihn ausführlich über den Sachverhalt informiert. Herr Mustermann zeigte jedoch kein Verständnis und erklärte mir, dass er mit dem Vertrag nicht einverstanden sei und die Unterschrift seines Sohnes für ungültig erkläre.<br><br>
Jetzt bin ich mir unsicher. Gilt die Unterschrift des Schülers nicht mehr? Ist der Vertrag zustande gekommen? Was sage ich Max, wenn er um den Aulaschlüssel bittet?<br><br>
<i>Schön, Schulsekretärin</i><br><br><b>2)</b> FD Recht mit der Bitte um Klärung. <b>3)</b> Wvl. am …</div></div>
<h2>Schritt 1: Chronologie erstellen</h2>
<p>Bringe Ordnung in den Fall: Was ist wann passiert? Die Daten brauchst du später für deine Prüfung („M könnte <b>am 10.11.</b> …“).</p>
<p><b>Erstelle zuerst selbst eine Chronologie</b> (Datum – Ereignis) und vergleiche dann mit der Lösung.</p>
<details class="card reveal"><summary><b>✓ Lösung<span class="sh"> anzeigen</span></b> <span class="mini">(erst nach deiner eigenen Chronologie öffnen)</span></summary>
<div class="tl">
<div class="ev"><div class="d">10.11.20..</div>Max (17) erkundigt sich im Sekretariat nach einer Mietmöglichkeit für die Aula. Frau Schön sagt nichts zu – sie muss erst mit dem Schulleiter sprechen.</div>
<div class="ev"><div class="d">vor dem 24.11.20..</div>Der Schulleiter unterschreibt den Mietvertrag (Miete 150 €, Haftung für Schäden).</div>
<div class="ev"><div class="d">24.11.20..</div>Frau Schön legt Max den unterschriebenen Vertrag vor. Max erklärt sein Einverständnis und unterschreibt.</div>
<div class="ev"><div class="d">01.12.20..</div>Der Vater erklärt gegenüber Frau Schön, er sei mit dem Vertrag nicht einverstanden und die Unterschrift seines Sohnes sei ungültig.</div></div>
</details>
<h2>Schritt 2: W-Fragen beantworten</h2>
<div class="w" data-w="m1-flips-w"></div>
<div class="box info"><span class="bt">Wer ist eigentlich „die Schule“?</span>Eine Schule ist selbst nicht rechtsfähig – Vertragspartner ist genau genommen der Schulträger (hier die Stadt Neustadt). Für unsere Lösung kürzen wir die Vertragspartnerin einfach mit <b>(G)</b> für Gutenberg-Gymnasium ab, Max mit <b>(M)</b>.</div>
<div class="w" data-w="m1-write-obersatz"></div>
<div class="w" data-w="m1-quiz-sv"></div>`},

{id:'m1-s2',title:'Die Willenserklärung',html:`
<p class="lead">Ein Vertrag – egal ob Kauf- oder Mietvertrag – kommt durch <b>zwei übereinstimmende Willenserklärungen</b> zustande: Antrag und Annahme. Deshalb musst du zuerst wissen, was eine Willenserklärung (WE) überhaupt ist.</p>
<div class="flow" style="max-width:640px"><div class="fl" style="border-color:var(--s1)"><b>WE 1: Antrag</b>z. B. Schule legt Mietvertrag vor</div><div class="arrow">+</div><div class="fl" style="border-color:var(--s3)"><b>WE 2: Annahme</b>z. B. Max unterschreibt</div><div class="arrow">=</div><div class="fl" style="border-color:var(--navy);background:#eef4f8"><b>Vertrag</b>Einigung</div></div>
<div class="box def"><span class="bt">Definition Willenserklärung</span>Eine Willenserklärung ist die Äußerung eines Willens, der unmittelbar auf die Herbeiführung einer Rechtsfolge gerichtet ist (z. B. einen Vertrag zu schließen oder zu kündigen).</div>
<h2>Die Merkmale einer Willenserklärung</h2>
<table class="t"><tr><th colspan="3" style="background:var(--s1bg)">innerer (subjektiver) Tatbestand: <i>Wille</i></th><th colspan="2" style="background:var(--s3bg)">äußerer (objektiver) Tatbestand: <i>Erklärung</i></th></tr>
<tr><th>Handlungswille</th><th>Erklärungsbewusstsein</th><th>Geschäftswille</th><th>Rechtsbindungswille</th><th>Äußerung</th></tr>
<tr><td>Wille, überhaupt zu handeln (sich zu äußern)</td><td>Bewusstsein, etwas rechtlich Erhebliches zu erklären</td><td>Wille, ein <b>bestimmtes</b> Rechtsgeschäft abzuschließen</td><td>für andere <b>objektiv erkennbarer</b> Wille, sich rechtlich zu binden</td><td><b>ausdrücklich</b> (mündlich, schriftlich, elektronisch) oder <b>konkludent</b> (schlüssiges Verhalten)</td></tr>
<tr><td class="mini">fehlt z. B. bei Reflexbewegungen, im Schlaf, unter Hypnose oder bei körperlichem Zwang</td><td class="mini">fehlt z. B. bei versehentlichem Winken in einer Versteigerung</td><td class="mini">fehlt z. B. beim Verschreiben auf dem Bestellschein</td><td class="mini">fehlt z. B. bei Gefälligkeiten oder unverbindlichen Anfragen</td><td class="mini">konkludent: Ware an der Kasse aufs Band legen, Münze in den Automaten werfen</td></tr></table>
<div class="box merke"><span class="bt">Wichtig für die Praxis</span>Ob eine Erklärung eine WE ist, beurteilt man so, wie ein objektiver Empfänger sie verstehen durfte (§§ 133, 157 BGB). Fehlt nur der <b>Geschäftswille</b> (oder unter Umständen das Erklärungsbewusstsein), liegt trotzdem eine WE vor – sie kann aber angefochten werden. Das lernst du in LS 2.</div>
<div class="box achtung"><span class="bt">Schweigen</span>Schweigen ist grundsätzlich <b>keine</b> Willenserklärung – wer nichts sagt, stimmt also nicht zu. Ausnahmen gelten u. a. unter Kaufleuten oder wenn das Gesetz es anordnet (z. B. § 108 II 2 BGB: Schweigen gilt als Verweigerung).</div>
<div class="w" data-w="m1-sort-we"></div>
<div class="w" data-w="m1-qa-we"></div>`},

{id:'m1-s3',title:'Abgabe und Zugang (§ 130 BGB)',html:`
<p class="lead">Eine Willenserklärung muss die „Bühne“ betreten: Sie muss <b>abgegeben</b> werden und – wenn sie sich an jemanden richtet – dem Empfänger <b>zugehen</b>. Erst dann wird sie wirksam.</p>
<div class="grid2">
<div class="card" style="border-top:5px solid var(--s1)"><h3 style="margin-top:0">Abgabe</h3><p>Der Erklärende hat seinen Willen <b>endgültig und bewusst</b> geäußert und die Erklärung so in Richtung Empfänger auf den Weg gebracht, dass unter normalen Umständen mit dem Zugang zu rechnen ist.</p><p class="mini">Worte aussprechen · Brief einwerfen · E-Mail absenden · Vertrag überreichen</p></div>
<div class="card" style="border-top:5px solid var(--s3)"><h3 style="margin-top:0">Zugang (§ 130 I 1 BGB)</h3><p>Die WE ist so in den <b>Machtbereich</b> des Empfängers gelangt, dass dieser die <b>Möglichkeit der Kenntnisnahme</b> hat und <b>unter normalen Umständen</b> mit der Kenntnisnahme zu rechnen ist.</p><p class="mini">Ob der Empfänger tatsächlich liest, ist egal!</p></div></div>
<h2>Wann wird eine WE wirksam?</h2>
<table class="t"><tr><th></th><th>Empfangsbedürftige WE<br><span class="mini">(richtet sich an jemanden: Antrag, Annahme, Kündigung)</span></th><th>Nicht empfangsbedürftige WE<br><span class="mini">(z. B. Testament)</span></th></tr>
<tr><th>unter Abwesenden<br><span class="mini">(gesetzlich geregelt)</span></th><td>mit <b>Zugang</b> nach <span class="norm">§ 130 I 1 BGB</span></td><td rowspan="2">bereits mit der <b>Abgabe</b>, z. B. wenn das unterschriebene Testament fertig ist</td></tr>
<tr><th>unter Anwesenden<br><span class="mini">(auch am Telefon, § 147 I 2 BGB)</span></th><td>Zugang <b>analog § 130 I 1 BGB</b>:<br><b>mündlich / telefonisch:</b> sobald der Empfänger sie <b>vernommen</b>, also gehört hat<br><b>schriftlich:</b> mit Übergabe des Schriftstücks (z. B. Brief, Vertrag)</td></tr></table>
<div class="box info"><span class="bt">Gut zu wissen</span>§ 130 I 1 BGB regelt ausdrücklich nur den Zugang unter <b>Abwesenden</b>. Für Erklärungen unter <b>Anwesenden</b> wird die Vorschrift <b>analog</b> (entsprechend) angewendet.</div>
<h3>Typische Zugangssituationen</h3>
<div class="grid2">
<div class="card"><b>✉️ Brief im Hausbriefkasten</b><p class="mini">Zugang, sobald üblicherweise mit der Leerung zu rechnen ist. Einwurf spätabends → Zugang am nächsten Tag.</p></div>
<div class="card"><b>🏢 Brief / E-Mail an eine Behörde oder Firma</b><p class="mini">Während der Geschäftszeiten: sofort. Außerhalb: mit Beginn der nächsten Geschäftszeit.</p></div>
<div class="card"><b>📞 Anrufbeantworter / Mailbox</b><p class="mini">Gilt als Erklärung unter Abwesenden – Zugang, sobald mit dem Abhören zu rechnen ist.</p></div>
<div class="card"><b>🏖️ Urlaub des Empfängers</b><p class="mini">Grundsätzlich unbeachtlich – es zählt, wann <i>normalerweise</i> mit der Kenntnisnahme zu rechnen ist. Ausnahmen nur in Sonderfällen (Treu und Glauben, § 242 BGB).</p></div></div>
<div class="box info"><span class="bt">Widerruf (§ 130 I 2 BGB)</span>Eine WE wird nicht wirksam, wenn dem Empfänger <b>vorher oder gleichzeitig</b> ein Widerruf zugeht. Entscheidend ist der Zugang – nicht, ob der Empfänger den Brief schon gelesen hat!</div>
<div class="box achtung"><span class="bt">Zugangsvereitelung</span>Wer den Zugang grundlos verhindert (z. B. sich versteckt oder die Annahme eines Einschreibens verweigert), muss sich nach Treu und Glauben (§ 242 BGB) so behandeln lassen, als sei die Erklärung rechtzeitig zugegangen.</div>
<div class="w" data-w="m1-quiz-zugang"></div>
<div class="w" data-w="m1-qa-zugang"></div>`},

{id:'m1-s4',title:'Antrag und Annahme (§§ 145 ff. BGB)',html:`
<p class="lead">Jetzt wird es konkret: Wann liegt ein Antrag vor? Wie lange kann er angenommen werden? Und was passiert, wenn die Annahme zu spät kommt oder etwas ändert?</p>
<div class="grid2">
<div class="box def" style="margin:0"><span class="bt">Definition Antrag (§ 145 BGB)</span>Ein Antrag ist eine einseitige empfangsbedürftige WE, mit der eine Seite der anderen mit erkennbarem Rechtsbindungswillen den Abschluss eines Vertrages anbietet. Die WE muss hierfür die <b>vertragswesentlichen Bestandteile</b> enthalten (hier: beim Kaufvertrag: Vertragspartner, Kaufsache und -preis) und so genau bestimmt sein, dass der Annehmende mit einem schlichten „Ja“ den Vertrag zustande kommen lassen kann.</div>
<div class="box def" style="margin:0"><span class="bt">Definition Annahme (§§ 146 ff. BGB)</span>Eine Annahme ist eine empfangsbedürftige WE, durch die ein Antrag <b>vorbehaltlos</b> innerhalb einer bestimmten <b>Annahmefrist</b> bejaht wird und damit zum Zustandekommen eines Vertrags führt.</div></div>
<h3>Die wesentlichen Vertragsbestandteile</h3>
<div class="grid3"><div class="card" style="text-align:center"><div style="font-size:1.5rem">👥</div><b>Vertragspartner</b><div class="mini">Wer mit wem?</div></div><div class="card" style="text-align:center"><div style="font-size:1.5rem">📦</div><b>Leistung</b><div class="mini">Kaufsache / Mietsache, Menge</div></div><div class="card" style="text-align:center"><div style="font-size:1.5rem">💶</div><b>Gegenleistung</b><div class="mini">Kaufpreis / Miete</div></div></div>
<h2>Kein Antrag: die „invitatio ad offerendum“</h2>
<p>Werbeprospekte, Kataloge, Schaufensterauslagen, Speisekarten oder Produktseiten im Online-Shop sind <b>keine Anträge</b>, sondern nur eine <b>Aufforderung, selbst einen Antrag abzugeben</b> (lat. invitatio ad offerendum). Sie richten sich an unbestimmt viele Personen – der Händler will sich nicht gegenüber jedem binden, denn sein Vorrat ist begrenzt. Der <b>Antrag kommt vom Kunden</b> (z. B. durch die Bestellung).</p>
<h2>Die Annahmefrist</h2>
<table class="t"><tr><th>Situation</th><th>Annahme möglich …</th><th>Norm</th></tr>
<tr><td>Antrag unter Anwesenden (auch telefonisch)</td><td>nur <b>sofort</b> – also solange das Gespräch bzw. das Telefonat andauert</td><td><span class="norm">§ 147 I BGB</span></td></tr>
<tr><td>Antrag unter Abwesenden (Brief, E-Mail)</td><td>bis zu dem Zeitpunkt, zu dem der Antragende den Eingang der Antwort unter <b>regelmäßigen Umständen</b> erwarten darf (Postlauf hin + Überlegungszeit + Postlauf zurück)</td><td><span class="norm">§ 147 II BGB</span></td></tr>
<tr><td>Antragender setzt eine Frist („gültig bis 08.12.“)</td><td>nur <b>innerhalb der Frist</b></td><td><span class="norm">§ 148 BGB</span></td></tr></table>
<h2>Sonderfälle – das Entscheidungsdiagramm</h2>
<div class="card"><svg viewBox="0 0 860 404" width="100%" role="img" aria-label="Entscheidungsbaum zur Annahme" style="font-family:Plus Jakarta Sans,sans-serif">
<defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#6b7f90"/></marker></defs><g font-size="13"><rect x="320" y="10" width="220" height="40" rx="10" fill="#eaf1fe" stroke="#2563eb" stroke-width="2"/><text x="430.0" y="35.0" text-anchor="middle" fill="#10273d" font-weight="700">Antrag liegt vor (§ 145 BGB)</text><line x1="430" y1="50" x2="430" y2="78" stroke="#6b7f90" stroke-width="2" marker-end="url(#ah)"/><rect x="260" y="80" width="340" height="44" rx="10" fill="#fff" stroke="#6b7f90" stroke-width="2"/><text x="430.0" y="107.0" text-anchor="middle" fill="#10273d">Stimmt die Antwort dem Antrag <tspan font-weight="700">vorbehaltlos</tspan> zu?</text><line x1="260" y1="102" x2="182" y2="102" stroke="#6b7f90" stroke-width="2" marker-end="url(#ah)"/><text x="221" y="94" text-anchor="middle" fill="#c2410c" font-weight="700">nein</text><rect x="10" y="72" width="170" height="62" rx="10" fill="#fde4d6" stroke="#c2410c" stroke-width="2"/><text x="95.0" y="90.0" text-anchor="middle" fill="#10273d" font-weight="700">Annahme (–)</text><text x="95.0" y="108.0" text-anchor="middle" fill="#8a2c08">Ablehnung mit Änderung =</text><text x="95.0" y="126.0" text-anchor="middle" fill="#8a2c08">neuer Antrag (§ 150 II BGB)</text><line x1="430" y1="124" x2="430" y2="158" stroke="#6b7f90" stroke-width="2" marker-end="url(#ah)"/><text x="445" y="146" text-anchor="middle" fill="#13703f" font-weight="700">ja</text><rect x="240" y="160" width="380" height="44" rx="10" fill="#fff" stroke="#6b7f90" stroke-width="2"/><text x="430.0" y="187.0" text-anchor="middle" fill="#10273d">Annahme <tspan font-weight="700">innerhalb der Annahmefrist</tspan> zugegangen?</text><line x1="620" y1="182" x2="678" y2="182" stroke="#6b7f90" stroke-width="2" marker-end="url(#ah)"/><text x="649" y="174" text-anchor="middle" fill="#13703f" font-weight="700">ja</text><rect x="680" y="152" width="170" height="62" rx="10" fill="#e7f6ee" stroke="#1f9d5c" stroke-width="2"/><text x="765.0" y="170.0" text-anchor="middle" fill="#10273d" font-weight="700">Annahme (+) → KV (+)</text><text x="765.0" y="188.0" text-anchor="middle" fill="#13703f">Einigung durch Antrag</text><text x="765.0" y="206.0" text-anchor="middle" fill="#13703f">und Annahme</text><line x1="430" y1="204" x2="430" y2="238" stroke="#6b7f90" stroke-width="2" marker-end="url(#ah)"/><text x="448" y="226" text-anchor="middle" fill="#c2410c" font-weight="700">nein</text><rect x="230" y="240" width="400" height="58" rx="10" fill="#fff" stroke="#6b7f90" stroke-width="2"/><text x="430.0" y="265.0" text-anchor="middle" fill="#10273d">Rechtzeitig abgeschickt, Transport ungewöhnlich</text><text x="430.0" y="283.0" text-anchor="middle" fill="#10273d">langsam – für den Antragenden <tspan font-weight="700">erkennbar</tspan>? (§ 149 S. 1)</text><line x1="230" y1="269" x2="182" y2="269" stroke="#6b7f90" stroke-width="2" marker-end="url(#ah)"/><text x="206" y="261" text-anchor="middle" fill="#c2410c" font-weight="700">nein</text><rect x="10" y="238" width="170" height="62" rx="10" fill="#fde4d6" stroke="#c2410c" stroke-width="2"/><text x="95.0" y="256.0" text-anchor="middle" fill="#10273d" font-weight="700">Annahme (–)</text><text x="95.0" y="274.0" text-anchor="middle" fill="#8a2c08">verspätete Annahme =</text><text x="95.0" y="292.0" text-anchor="middle" fill="#8a2c08">neuer Antrag (§ 150 I BGB)</text><line x1="430" y1="298" x2="430" y2="332" stroke="#6b7f90" stroke-width="2" marker-end="url(#ah)"/><text x="445" y="320" text-anchor="middle" fill="#13703f" font-weight="700">ja</text><rect x="230" y="334" width="400" height="58" rx="10" fill="#e4f5f3" stroke="#0d8a80" stroke-width="2"/><text x="430.0" y="359.0" text-anchor="middle" fill="#10273d">Hat der Antragende die Verspätung</text><text x="430.0" y="377.0" text-anchor="middle" fill="#10273d"><tspan font-weight="700">unverzüglich angezeigt</tspan>? (§ 149 S. 2)</text><line x1="230" y1="363" x2="182" y2="363" stroke="#6b7f90" stroke-width="2" marker-end="url(#ah)"/><text x="206" y="355" text-anchor="middle" fill="#c2410c" font-weight="700">ja</text><rect x="10" y="332" width="170" height="62" rx="10" fill="#fde4d6" stroke="#c2410c" stroke-width="2"/><text x="95.0" y="350.0" text-anchor="middle" fill="#10273d" font-weight="700">Annahme (–)</text><text x="95.0" y="368.0" text-anchor="middle" fill="#8a2c08">verspätet; neuer Antrag</text><text x="95.0" y="386.0" text-anchor="middle" fill="#8a2c08">(§ 150 I BGB)</text><line x1="630" y1="363" x2="678" y2="363" stroke="#6b7f90" stroke-width="2" marker-end="url(#ah)"/><text x="654" y="355" text-anchor="middle" fill="#13703f" font-weight="700">nein</text><rect x="680" y="332" width="170" height="62" rx="10" fill="#e7f6ee" stroke="#1f9d5c" stroke-width="2"/><text x="765.0" y="350.0" text-anchor="middle" fill="#10273d" font-weight="700">Annahme (+) → KV (+)</text><text x="765.0" y="368.0" text-anchor="middle" fill="#13703f">gilt als nicht verspätet</text><text x="765.0" y="386.0" text-anchor="middle" fill="#13703f">(§ 149 S. 2 BGB)</text></g></svg>
<p class="mini" style="margin:8px 0 0">Bei § 150 I und II entsteht ein <b>neuer Antrag</b>. Nimmt der andere Teil ihn an, kann doch noch ein Vertrag zustande kommen – dann prüfst du diesen neuen Antrag und seine Annahme von vorn.</p></div>
<div class="box info"><span class="bt">Erlöschen des Antrags (§ 146 BGB)</span>Ein Antrag erlischt, wenn er <b>abgelehnt</b> (Alt. 1) oder <b>nicht rechtzeitig angenommen</b> wird (Alt. 2). Ein erloschener Antrag kann nicht mehr angenommen werden.</div>
<div class="w" data-w="m1-quiz-aa"></div>
<div class="w" data-w="m1-qa-aa"></div>`},

{id:'m1-s5',title:'Übungsfälle zum Vertragsschluss',html:`
<p class="lead">Bevor du die LS 1 „Theater mit dem Vater“ löst, trainierst du den Vertragsschluss an fünf Fällen aus der Stadt Neustadt. Ihr arbeitet in <b>Kleingruppen</b>: Jede Gruppe erhält einen Fall, erstellt dazu eine Lösungsskizze und formuliert anschließend das Gutachten.</p>
<h2>So geht ihr vor</h2>
<div class="flow">
<div class="fl" style="border-color:var(--s1)"><b>① Fall lesen</b>Ladet euer Fallmaterial herunter und erfasst den Sachverhalt (Chronologie, W-Fragen).</div><div class="arrow">→</div>
<div class="fl" style="border-color:var(--s2)"><b>② Lösungsskizze</b>Prüfungsreihenfolge mit Normen und Teilergebnissen (+)/(–) – die Vorbereitung fürs Gutachten.</div><div class="arrow">→</div>
<div class="fl" style="border-color:var(--s3)"><b>③ Gutachten</b>Formuliert eure Skizze mit der 4-Schritt-Methode aus.</div><div class="arrow">→</div>
<div class="fl" style="border-color:var(--s4)"><b>④ Einreichen</b>Ladet Lösungsskizze und Gutachten in <b>LearningView</b> hoch.</div></div>
<div class="box info"><span class="bt">Hilfen</span>Nutzt das <a href="#m1-s4">Entscheidungsdiagramm zur Annahme</a>, die <a href="#m0-s4">4-Schritt-Methode</a> und vor dem Einreichen die <a href="#m0-s6">Checkliste zur Bewertung eines Gutachtens</a>.</div>
<h2>Die Fälle zum Download</h2>
<div class="grid3" style="grid-template-columns:repeat(auto-fit,minmax(160px,1fr))"><div class="card" style="margin:0;display:flex;flex-direction:column;gap:6px"><div><span class="tag">Fall A</span></div><b style="font-family:Fraunces,serif;font-size:1.08rem;color:var(--navy)">Papierstau</b><div class="mini" style="flex:1">Muss der Schreibwarenhandel „Papierstau“ der Stadt das bestellte Papier liefern?</div><a class="btn sm teal" style="text-decoration:none;text-align:center" href="material/LS1_Fall_A_Papierstau.pdf" target="_blank" rel="noopener">📄 PDF · 4 S. ↗</a></div><div class="card" style="margin:0;display:flex;flex-direction:column;gap:6px"><div><span class="tag">Fall B</span></div><b style="font-family:Fraunces,serif;font-size:1.08rem;color:var(--navy)">Das Faxgerät</b><div class="mini" style="flex:1">Ist zwischen der Stadt und Frau Klein ein Kaufvertrag über das Faxgerät zustande gekommen?</div><a class="btn sm teal" style="text-decoration:none;text-align:center" href="material/LS1_Fall_B_Faxgeraet.pdf" target="_blank" rel="noopener">📄 PDF · 1 S. ↗</a></div><div class="card" style="margin:0;display:flex;flex-direction:column;gap:6px"><div><span class="tag">Fall C</span></div><b style="font-family:Fraunces,serif;font-size:1.08rem;color:var(--navy)">Schick und Schnell</b><div class="mini" style="flex:1">Ist zwischen der Stadt und „Schick und Schnell“ ein Kaufvertrag über die Büromöbel zustande gekommen?</div><a class="btn sm teal" style="text-decoration:none;text-align:center" href="material/LS1_Fall_C_Schick_und_Schnell.pdf" target="_blank" rel="noopener">📄 PDF · 3 S. ↗</a></div><div class="card" style="margin:0;display:flex;flex-direction:column;gap:6px"><div><span class="tag">Fall D</span></div><b style="font-family:Fraunces,serif;font-size:1.08rem;color:var(--navy)">Papierstau, Teil 2</b><div class="mini" style="flex:1">Muss „Papierstau“ der Stadt das bestellte Papier nun liefern?</div><a class="btn sm teal" style="text-decoration:none;text-align:center" href="material/LS1_Fall_D_Papierstau_Teil2.pdf" target="_blank" rel="noopener">📄 PDF · 5 S. ↗</a></div><div class="card" style="margin:0;display:flex;flex-direction:column;gap:6px"><div><span class="tag">Fall E</span></div><b style="font-family:Fraunces,serif;font-size:1.08rem;color:var(--navy)">Das Gemälde</b><div class="mini" style="flex:1">Kann die Stadt von Frau Schulte die Zahlung des Kaufpreises für das Gemälde verlangen?</div><a class="btn sm teal" style="text-decoration:none;text-align:center" href="material/LS1_Fall_E_Gemaelde.pdf" target="_blank" rel="noopener">📄 PDF · 5 S. ↗</a></div></div>
<h2>Lösungsskizzen zum Vergleich</h2>
<p>Öffnet die Lösungsskizze zu eurem Fall erst, wenn ihr eure eigene Skizze fertig habt. Vergleicht dann Prüfungsreihenfolge, Normen und Teilergebnisse und korrigiert eure Skizze, <b>bevor</b> ihr das Gutachten schreibt.</p>
<details class="card reveal"><summary><b>Lösungsskizze Fall A – Papierstau</b> <span class="mini">(erst nach eurer eigenen Skizze öffnen)</span></summary><p class="mini">Papierstau wirbt mit einem Flyer für Papier-Angebote. Die Stadt bestellt am 20.01. Papier zu den Flyer-Preisen. Papierstau antwortet am 25.01.: „ausverkauft“ – bietet aber anderes Papier an.</p><div class="tree"><ul><li>N könnte gegen P Anspruch auf Lieferung gem. § 433 I 1 BGB haben – wirksamer KV?<ul>
<li>Antrag von P durch Flyer (§ 145)? Bestimmte Vertragspartei <span class="no">(–)</span>, kein Rechtsbindungswille → nur invitatio ad offerendum <span class="no">(–)</span></li>
<li>Antrag von N am 20.01. (Bestellung) <span class="ok">(+)</span>: Parteien, Leistung, Gegenleistung, Zugang <span class="ok">(+)</span></li>
<li>Annahme durch P am 25.01.? Kein Einverständnis – P lehnt ab <span class="no">(–)</span>, Antrag erlischt (§ 146 Alt. 1)</li>
<li><span class="te">Einigung (–) → KV (–) → Anspruch (–)</span></li></ul></li></ul></div></details><details class="card reveal"><summary><b>Lösungsskizze Fall B – Das Faxgerät</b> <span class="mini">(erst nach eurer eigenen Skizze öffnen)</span></summary><p class="mini">Frau Klein bietet der Stadt am Telefon ein Faxgerät für 599 € an. Der Sachbearbeiter lehnt ab, ruft 20 Minuten später zurück und will doch bestellen – das Gerät ist inzwischen verkauft.</p><div class="tree"><ul><li>N könnte gegen K Anspruch auf Lieferung gem. § 433 I 1 BGB haben – wirksamer KV?<ul>
<li>Antrag von K am Telefon (§ 145) <span class="ok">(+)</span>, Zugang <span class="ok">(+)</span></li>
<li>Annahme im ersten Telefonat? N lehnt ab <span class="no">(–)</span> → Antrag erlischt (§ 146 Alt. 1)</li>
<li>Annahme im zweiten Telefonat? Zustimmung (+), aber Antrag unter Anwesenden nur <b>sofort</b> annehmbar (§ 147 I 2) und bereits erloschen <span class="no">(–)</span> → Rückruf gilt als neuer Antrag (§ 150 I), den K nicht annimmt</li>
<li><span class="te">Einigung (–) → KV (–) → Anspruch (–)</span></li></ul></li></ul></div></details><details class="card reveal"><summary><b>Lösungsskizze Fall C – Schick und Schnell</b> <span class="mini">(erst nach eurer eigenen Skizze öffnen)</span></summary><p class="mini">Ein Möbelhändler bietet der Stadt am 01.12. Tisch und Sessel an: „Dieses Angebot ist gültig bis zum 08.12.“ Die Stadt bestellt am 09.12.</p><div class="tree"><ul><li>Ist ein wirksamer KV gem. § 433 BGB zustande gekommen?<ul>
<li>Antrag von S am 01.12. (§ 145) <span class="ok">(+)</span>, Bindung bis 08.12. (§ 148), Zugang <span class="ok">(+)</span></li>
<li>Annahme von N am 09.12.? Zustimmung (+), aber Frist nach § 148 abgelaufen <span class="no">(–)</span></li>
<li>Rechtsfolge: verspätete Annahme = neuer Antrag (§ 150 I) – S müsste diesen erst annehmen</li>
<li><span class="te">Einigung (–) → KV (–)</span></li></ul></li></ul></div></details><details class="card reveal"><summary><b>Lösungsskizze Fall D – Papierstau, Teil 2</b> <span class="mini">(erst nach eurer eigenen Skizze öffnen)</span></summary><p class="mini">Wie Fall A – aber die Stadt bestellt am 29.01. das neu angebotene Umweltpapier zu den genannten Konditionen.</p><div class="tree"><ul><li>N könnte gegen P Anspruch auf Lieferung gem. § 433 I 1 BGB haben – wirksamer KV?<ul>
<li>Flyer = invitatio <span class="no">(–)</span>; Antrag von N am 20.01. <span class="ok">(+)</span></li>
<li>Antwort von P am 25.01.: keine uneingeschränkte Zustimmung → Ablehnung mit Änderung = <b>neuer Antrag</b> (§ 150 II) <span class="ok">(+)</span></li>
<li>Annahme von N am 29.01. (§ 147 II): uneingeschränkt (+), rechtzeitig (+), Zugang (+) <span class="ok">(+)</span></li>
<li><span class="te">Einigung (+) → KV (+) → Anspruch (+)</span></li></ul></li></ul></div></details><details class="card reveal"><summary><b>Lösungsskizze Fall E – Das Gemälde</b> <span class="mini">(erst nach eurer eigenen Skizze öffnen)</span></summary><p class="mini">Das Museum der Stadt bietet Frau Schulte am 23.11. ein Gemälde für 850.000 € an – Antwort bis 07.12. Frau Schulte nimmt mit Brief vom 25.11. an; der Brief kommt durch eine Verzögerung bei der Post erst am 14.12. an. Das Museum meldet sich nicht wegen der Verspätung, sondern schickt am 15.12. einen Boten. Frau Schulte will das Bild nun nicht mehr.</p><div class="tree"><ul><li>N könnte gegen S Anspruch auf Zahlung von 850.000 € gem. § 433 II BGB haben – wirksamer KV?<ul>
<li>Antrag von N am 23.11. <span class="ok">(+)</span>, Frist bis 07.12. (§ 148)</li>
<li>Annahme von S am 25.11.: uneingeschränkt (+); Zugang erst 14.12. → eigentlich verspätet</li>
<li>Aber § 149 S. 1: rechtzeitig abgesandt, bei regelmäßiger Beförderung rechtzeitig, für N erkennbar (Datum 25.11.) <span class="ok">(+)</span> → N hätte die Verspätung unverzüglich anzeigen müssen; das unterbleibt → Annahme gilt als <b>nicht verspätet</b> (§ 149 S. 2)</li>
<li><span class="te">Einigung (+) → KV (+) → Anspruch (+)</span></li></ul></li></ul></div></details>
<h2>Kurzcheck nach der Gruppenarbeit</h2>

function G(t,a,b,c,d){return `<div class="gut">${t?`<div class="ttl">${t}</div>`:''}<div class="row r1"><div class="lab">① TBM</div><div class="txt">${a}</div></div><div class="row r2"><div class="lab">② Definition</div><div class="txt">${b}</div></div><div class="row r3"><div class="lab">③ Subsumtion</div><div class="txt">${c}</div></div><div class="row r4"><div class="lab">④ Conclusio</div><div class="txt">${d}</div></div></div>`;}

const GUT_VERTRAG=`<p><b>Obersatz:</b> Das Gutenberg-Gymnasium (G) könnte gegen Max Mustermann (M) einen Anspruch auf Erfüllung des Mietvertrages über die Aula, insbesondere auf Zahlung der Miete i. H. v. 150,00 €, aus § 535 II BGB haben.</p>
<p>Dazu müsste der Anspruch entstanden sein. Das ist der Fall, wenn zwischen G und M ein wirksamer Mietvertrag zustande gekommen ist. Ein Vertrag kommt durch zwei übereinstimmende Willenserklärungen, Antrag und Annahme (§§ 145 ff. BGB), zustande.</p>
${G('1. Antrag des M am 10.11.','M könnte am 10.11. im Sekretariat einen Antrag auf Abschluss eines Mietvertrages gem. § 145 BGB gemacht haben.','Ein Antrag ist eine einseitige empfangsbedürftige WE, mit der eine Seite der anderen mit erkennbarem Rechtsbindungswillen den Abschluss eines Vertrages anbietet. Die WE muss hierfür die vertragswesentlichen Bestandteile enthalten (hier: Vertragspartner, Mietsache und -zins) und so genau bestimmt sein, dass der Annehmende mit einem schlichten „Ja“ den Vertrag zustande kommen lassen kann.','M hat sich als Jahrgangssprecher lediglich nach einer Mietmöglichkeit für die Aula <i>erkundigt</i>. Zwar sind die Vertragsparteien (M und G) und die Mietsache (Aula) erkennbar, über die Höhe der Miete wurde jedoch nicht gesprochen. Zudem wollte M erst klären, ob eine Anmietung überhaupt möglich ist; ein Wille, sich bereits rechtlich zu binden, ist nicht erkennbar. Ein bloßes „Ja“ der Sekretärin hätte daher keinen Vertrag mit bestimmtem Inhalt entstehen lassen.','Ein Antrag des M am 10.11. liegt somit nicht vor.')}
<div class="box info" style="font-size:.9rem"><span class="bt">Vertretbar ist auch …</span>… einen Antrag des M anzunehmen. Dann scheitert der Vertragsschluss an diesem Tag an der Annahme: Frau Schön hat nicht zugestimmt, und ein Antrag unter Anwesenden kann nur sofort angenommen werden (§ 147 I 1 BGB) – er ist erloschen (§ 146 BGB).</div>
${G('2. Antrag des G am 24.11.','G könnte M am 24.11. durch die Vorlage des vom Schulleiter unterschriebenen Mietvertrages einen Antrag gem. § 145 BGB gemacht haben.','Ein Antrag ist – wie oben definiert – eine einseitige empfangsbedürftige WE, mit der eine Seite der anderen mit erkennbarem Rechtsbindungswillen den Abschluss eines Vertrages anbietet und die alle vertragswesentlichen Bestandteile enthält, sodass der Annehmende mit einem schlichten „Ja“ den Vertrag zustande kommen lassen kann.','Der schriftliche Mietvertrag nennt die Vertragsparteien (G und M), die Mietsache (Aula für das Abi-Varieté) und die Miete (150,00 €). Durch die Unterschrift des Schulleiters bringt G zum Ausdruck, sich rechtlich binden zu wollen. M musste nur noch unterschreiben.','Ein Antrag des G liegt somit vor.')}
${G('3. Zugang des Antrags','Der Antrag des G müsste dem M am 24.11. zugegangen sein.','Eine WE ist zugegangen, wenn sie so in den Machtbereich des Empfängers gelangt ist, dass dieser die Möglichkeit der Kenntnisnahme hat und unter normalen Umständen mit der Kenntnisnahme zu rechnen ist. Eine schriftliche WE gegenüber einem Anwesenden geht daher mit der Übergabe zu.','Frau Schön hat M den unterschriebenen Vertrag im persönlichen Gespräch vorgelegt; M konnte ihn lesen und hat ihn unterschrieben.','Der Antrag ist M am 24.11. zugegangen.')}
${G('4. Annahme durch M am 24.11.','M könnte den Antrag des G am 24.11. durch seine Unterschrift gem. § 147 I BGB angenommen haben.','Eine Annahme ist eine empfangsbedürftige WE, durch die ein Antrag vorbehaltlos innerhalb einer bestimmten Annahmefrist bejaht wird und damit zum Zustandekommen eines Vertrags führt. Ein Antrag unter Anwesenden kann nur sofort angenommen werden (§ 147 I 1 BGB).','M hat erklärt, mit dem Vertrag einverstanden zu sein, und ihn ohne Änderungen oder Bedingungen unterschrieben; er hat den Antrag also vorbehaltlos bejaht. Das geschah im selben Gespräch, also sofort und damit innerhalb der Annahmefrist des § 147 I 1 BGB. Da Frau Schön anwesend war, ist ihr die Annahme auch unmittelbar zugegangen.','M hat den Antrag somit rechtzeitig und wirksam angenommen.')}
<p><b>Teilergebnis:</b> G und M haben sich durch Antrag und Annahme geeinigt. Ein Mietvertrag ist zustande gekommen.</p>`;

const GUT_GF=`<p>Fraglich ist jedoch, ob der Mietvertrag auch wirksam ist, da M bei Vertragsschluss erst 17 Jahre alt war.</p>
${G('5. Beschränkte Geschäftsfähigkeit des M','M könnte bei Vertragsschluss am 24.11. gem. § 106 BGB beschränkt geschäftsfähig gewesen sein.','Beschränkt geschäftsfähig ist ein Minderjähriger, der das siebente Lebensjahr vollendet hat (§ 106 BGB). Minderjährig ist, wer das 18. Lebensjahr noch nicht vollendet hat (§ 2 BGB).','M ist 17 Jahre alt.','M ist somit beschränkt geschäftsfähig. Für die Wirksamkeit seiner Willenserklärung gelten die §§ 107 ff. BGB.')}
${G('6. Lediglich rechtlicher Vorteil?','Der Abschluss des Mietvertrages könnte für M lediglich rechtlich vorteilhaft sein, sodass er keine Einwilligung benötigte (§ 107 BGB).','Lediglich rechtlich vorteilhaft ist ein Rechtsgeschäft, wenn es für den Minderjährigen keine rechtlichen Pflichten begründet und seine Rechte nicht mindert. Wirtschaftliche Vorteile spielen keine Rolle.','Durch den Mietvertrag wird M selbst verpflichtet, die Miete von 150,00 € zu zahlen und für Schäden an der Aula zu haften. Dass der Jahrgang die Kosten intern übernehmen will, ändert nichts daran, dass M gegenüber G der Schuldner ist. Auch die Aussage, M „entstünden keine Kosten“, ist daher rechtlich unerheblich.','Der Vertrag ist für M nicht lediglich rechtlich vorteilhaft. Er benötigt die Einwilligung seines gesetzlichen Vertreters.')}
${G('7. Einwilligung der Eltern','Die Eltern des M als gesetzliche Vertreter (§ 1629 I BGB) müssten vor dem Vertragsschluss am 24.11. eingewilligt haben (§§ 107, 183 BGB).','Eine Einwilligung ist die vorherige Zustimmung (§ 183 S. 1 BGB). Sie kann ausdrücklich oder durch schlüssiges Verhalten erteilt werden. Ein gesetzlich geregelter Sonderfall ist § 110 BGB: Ein Vertrag gilt als von Anfang an wirksam, wenn der Minderjährige die Leistung mit Mitteln bewirkt, die ihm zu diesem Zweck oder zur freien Verfügung überlassen wurden („Taschengeldparagraf“).','Laut Sachverhalt wussten die Eltern vorher nichts von dem Vertrag; eine ausdrückliche oder schlüssige Einwilligung liegt nicht vor. § 110 BGB greift ebenfalls nicht: M hat die Miete noch nicht gezahlt („bewirkt“), und das Geld soll aus der Jahrgangskasse stammen – nicht aus Mitteln, die ihm seine Eltern überlassen haben.','Eine Einwilligung liegt nicht vor. Der Vertrag ist daher zunächst <b>schwebend unwirksam</b>; seine Wirksamkeit hängt von der Genehmigung der Eltern ab (§ 108 I BGB).')}
${G('8. Genehmigung durch den Vater','Der Vertrag könnte durch eine Genehmigung des Vaters gem. §§ 108 I, 184 I BGB wirksam geworden sein.','Eine Genehmigung ist die nachträgliche Zustimmung (§ 184 I BGB). Sie kann gegenüber dem Minderjährigen oder gegenüber dem Vertragspartner erklärt werden (§ 182 I BGB). Wird sie verweigert, ist der schwebend unwirksame Vertrag endgültig unwirksam.','Herr Mustermann hat am 01.12. gegenüber Frau Schön, also gegenüber der Vertragspartnerin G, ausdrücklich erklärt, er sei mit dem Vertrag nicht einverstanden und die Unterschrift seines Sohnes sei ungültig. Damit hat er die Genehmigung verweigert.','Eine Genehmigung liegt nicht vor. Der Mietvertrag ist <b>endgültig unwirksam</b>.')}
<p><b>Teilergebnis:</b> Ein wirksamer Mietvertrag liegt nicht vor. Der Anspruch ist nicht entstanden.</p>
<p><b>Ergebnis:</b> G hat gegen M keinen Anspruch auf Erfüllung des Mietvertrages aus § 535 II BGB. Umgekehrt hat auch M keinen Anspruch auf Überlassung der Aula (§ 535 I 1 BGB) – Frau Schön muss ihm den Schlüssel nicht aushändigen.</p>`;

{id:'m1-s6',title:'Geschäftsfähigkeit (§§ 104–113 BGB)',html:`
<p class="lead">Im Fall „Theater mit dem Vater“ ist der Vertrag zwar zustande gekommen – aber ist er auch <b>wirksam</b>? Max ist erst 17. Hier kommt die Geschäftsfähigkeit ins Spiel.</p>
<div class="box def"><span class="bt">Definition</span><b>Geschäftsfähigkeit</b> ist die Fähigkeit, Rechtsgeschäfte selbstständig wirksam vorzunehmen. (Nicht verwechseln mit der <b>Rechtsfähigkeit</b> – der Fähigkeit, Träger von Rechten und Pflichten zu sein. Sie hat jeder Mensch ab Geburt, § 1 BGB.)</div>
<div class="grid3">
<div class="card" style="border-top:6px solid #c2410c"><span class="tag">0 bis 6 Jahre</span><h3 style="margin-top:.4em">Geschäftsunfähig</h3><p><span class="norm">§ 104 BGB</span>: Kinder unter 7 Jahren (Nr. 1) und dauerhaft krankhaft geistig Gestörte (Nr. 2)</p><p><b>Rechtsfolge:</b> WE ist <b>nichtig</b> (<span class="norm">§ 105 I BGB</span>) – auch mit Zustimmung der Eltern!</p><p class="mini">Ebenso nichtig: WE im Zustand der Bewusstlosigkeit oder vorübergehenden Störung der Geistestätigkeit (§ 105 II BGB), z. B. Volltrunkenheit.</p></div>
<div class="card" style="border-top:6px solid #c27803"><span class="tag">7 bis 17 Jahre</span><h3 style="margin-top:.4em">Beschränkt geschäftsfähig</h3><p><span class="norm">§ 106 BGB</span>: Minderjährige ab Vollendung des 7. Lebensjahres</p><p><b>Rechtsfolge:</b> WE wirksam, wenn <b>lediglich rechtlich vorteilhaft</b> oder mit <b>Zustimmung</b> der gesetzlichen Vertreter (<span class="norm">§§ 107–113 BGB</span>); sonst <b>schwebend unwirksam</b>.</p></div>
<div class="card" style="border-top:6px solid #1f9d5c"><span class="tag">ab 18 Jahren</span><h3 style="margin-top:.4em">Voll geschäftsfähig</h3><p><span class="norm">§ 2 BGB</span>: Volljährigkeit mit Vollendung des 18. Lebensjahres</p><p><b>Rechtsfolge:</b> WE uneingeschränkt wirksam.</p></div></div>
<h2>Prüfschema beim beschränkt Geschäftsfähigen</h2>
<div class="card"><svg viewBox="0 0 860 330" width="100%" role="img" aria-label="Prüfschema beschränkte Geschäftsfähigkeit" style="font-family:Plus Jakarta Sans,sans-serif">

<rect x="300" y="8" width="260" height="40" rx="10" fill="#fdf3e2" stroke="#c27803" stroke-width="2"/><text x="430" y="33" text-anchor="middle" font-weight="700" fill="#10273d">7–17 Jahre (§ 106 BGB)</text>
<line x1="430" y1="48" x2="430" y2="74" stroke="#6b7f90" stroke-width="2" marker-end="url(#ah2)"/>

<line x1="590" y1="96" x2="690" y2="96" stroke="#6b7f90" stroke-width="2" marker-end="url(#ah2)"/><text x="640" y="88" text-anchor="middle" fill="#13703f" font-weight="700">ja</text>

<line x1="430" y1="116" x2="430" y2="142" stroke="#6b7f90" stroke-width="2" marker-end="url(#ah2)"/><text x="445" y="134" fill="#c2410c" font-weight="700">nein</text>
<rect x="230" y="144" width="400" height="40" rx="10" fill="#fff" stroke="#6b7f90" stroke-width="2"/><text x="430" y="169" text-anchor="middle" fill="#10273d">Einwilligung (vorher, § 183) – auch § 110 BGB?</text>

<line x1="250" y1="298" x2="170" y2="298" stroke="#6b7f90" stroke-width="2" marker-end="url(#ah2)"/><text x="210" y="290" text-anchor="middle" fill="#c2410c" font-weight="700">nein</text>
<rect x="8" y="274" width="160" height="48" rx="10" fill="#fde4d6" stroke="#c2410c" stroke-width="2"/><text x="88" y="295" text-anchor="middle" font-weight="700" fill="#10273d">endgültig</text><text x="88" y="312" text-anchor="middle" font-weight="700" fill="#10273d">unwirksam</text></g></svg></div>
<h2>Zustimmung = Einwilligung oder Genehmigung (§ 182 BGB)</h2>
<div class="grid2"><div class="card" style="border-left:6px solid var(--s1)"><h3 style="margin-top:0">Einwilligung – <i>vorher</i></h3><p><span class="norm">§ 183 S. 1 BGB</span>: vorherige Zustimmung. Ausdrücklich („Du darfst dir das Fahrrad für 300 € kaufen“) oder durch schlüssiges Verhalten.</p></div>
<div class="card" style="border-left:6px solid var(--s3)"><h3 style="margin-top:0">Genehmigung – <i>nachher</i></h3><p><span class="norm">§ 184 I BGB</span>: nachträgliche Zustimmung; sie wirkt auf den Zeitpunkt des Vertragsschlusses zurück. Kann gegenüber dem Minderjährigen <b>oder</b> dem Vertragspartner erklärt werden (§ 182 I BGB).</p></div></div>
<h2>Weitere wichtige Regeln</h2>
<table class="t">
<tr><td style="width:150px"><span class="norm">§ 107 BGB</span></td><td><b>Lediglich rechtlicher Vorteil:</b> Der Minderjährige erhält nur Rechte, ohne Pflichten – z. B. er bekommt etwas geschenkt. Ein Kauf ist <b>nie</b> lediglich rechtlich vorteilhaft (Pflicht zur Zahlung!), auch wenn er ein „Schnäppchen“ ist.</td></tr>
<tr><td><span class="norm">§ 108 II BGB</span></td><td>Der Vertragspartner kann die Eltern zur Erklärung über die Genehmigung <b>auffordern</b>. Dann kann die Genehmigung nur noch ihm gegenüber erklärt werden – und nur innerhalb von <b>zwei Wochen</b>. Schweigen gilt als Verweigerung.</td></tr>
<tr><td><span class="norm">§ 108 III BGB</span></td><td>Wird der Minderjährige volljährig, kann er den Vertrag selbst genehmigen.</td></tr>
<tr><td><span class="norm">§ 109 BGB</span></td><td>Bis zur Genehmigung kann der Vertragspartner seine Erklärung <b>widerrufen</b> – außer er kannte die Minderjährigkeit (dann nur, wenn der Minderjährige wahrheitswidrig eine Einwilligung behauptet hat).</td></tr>
<tr><td><span class="norm">§ 110 BGB</span></td><td><b>„Taschengeldparagraf“:</b> wirksam, wenn der Minderjährige die Leistung <b>vollständig bewirkt</b> mit Mitteln, die ihm dafür oder zur freien Verfügung überlassen wurden. Ratenkäufe fallen nicht darunter!</td></tr>
<tr><td><span class="norm">§§ 112, 113 BGB</span></td><td>Teilgeschäftsfähigkeit: für ein mit Genehmigung betriebenes Erwerbsgeschäft (§ 112) bzw. ein erlaubtes Dienst- oder Arbeitsverhältnis (§ 113).</td></tr></table>
<div class="box info"><span class="bt">Gesetzliche Vertreter</span>Gesetzliche Vertreter eines Kindes sind in der Regel <b>beide Eltern gemeinsam</b> (§ 1629 I BGB). Verweigert ein Elternteil die Zustimmung, fehlt die gemeinsame Zustimmung.</div>

{id:'m1-s7',title:'Fristen berechnen (§§ 186 ff. BGB)',html:`
<p class="lead">Annahmefristen (§ 148 BGB), die Zwei-Wochen-Frist des § 108 II BGB, später Widerspruchs- und Kündigungsfristen: In der Verwaltung musst du Fristen sicher berechnen können. Dafür gibt es klare Regeln im BGB.</p>
<div class="flow">
<div class="fl" style="border-color:var(--s1)"><b>1. Ereignistag bestimmen</b>Was löst die Frist aus? Meist der Zugang. <span class="norm">§ 187 I BGB</span>: Der Ereignistag zählt <b>nicht</b> mit.</div><div class="arrow">→</div>
<div class="fl" style="border-color:var(--s2)"><b>2. Fristbeginn</b>am Tag nach dem Ereignis, 0:00 Uhr</div><div class="arrow">→</div>
<div class="fl" style="border-color:var(--s3)"><b>3. Fristende</b><span class="norm">§ 188 II BGB</span>: Wochen-/Monatsfrist endet an dem Tag, der dem Ereignistag nach Name bzw. Zahl entspricht, 24:00 Uhr.</div><div class="arrow">→</div>
<div class="fl" style="border-color:var(--s4)"><b>4. Wochenende/Feiertag?</b><span class="norm">§ 193 BGB</span>: Fällt das Ende auf Samstag, Sonntag oder Feiertag, endet die Frist am nächsten Werktag.</div></div>
<div class="grid2">
<div class="card"><b>Beispiel Wochenfrist</b><p>Zugang am <b>Mittwoch, 05.11.</b>, Frist zwei Wochen.<br>→ Beginn: Do., 06.11. · Ende: <b>Mittwoch, 19.11., 24:00 Uhr</b></p></div>
<div class="card"><b>Beispiel Monatsfrist mit § 188 III</b><p>Zugang am <b>31.12.2011</b>, Frist vier Monate.<br>→ Einen 31.04. gibt es nicht → Ende am letzten Tag des Monats: <b>30.04.2012, 24:00 Uhr</b></p></div></div>
<div class="box info"><span class="bt">Sonderfall: Beginnfrist und Lebensalter (§ 187 II BGB)</span>Beginnt eine Frist mit dem Anfang eines Tages, zählt dieser Tag mit. So beim Lebensalter: Wer am 10.05.2008 geboren ist, wird mit Beginn des <b>10.05.2026</b> (0:00 Uhr) volljährig (§ 187 II 2 BGB).</div>
<div class="w" data-w="m1-frist"></div>
<div class="w" data-w="m1-quiz-frist"></div>`},

{id:'m1-s8',title:'Die Lösungsskizze zum Fall',html:`
<p class="lead">Jetzt setzt du alles zusammen. Entscheide zuerst selbst, welche Prüfungspunkte erfüllt sind – danach siehst du die komplette Lösungsskizze.</p>
<div class="w" data-w="m1-sort-skizze"></div>
<details class="card"><summary><b>Komplette Lösungsskizze anzeigen</b></summary>
<div class="tree" style="margin-top:12px"><ul><li><b>G könnte gegen M einen Anspruch auf Erfüllung des Mietvertrages (Zahlung der Miete i. H. v. 150 €) gem. § 535 II BGB haben.</b>
<ul><li><b>I. Anspruch entstanden?</b> – wirksamer Mietvertrag
<ul><li>Einigung durch Antrag und Annahme (§§ 145 ff. BGB)
<ul><li><b>10.11.:</b> Antrag durch M (§ 145)? Miete nicht genannt, kein Rechtsbindungswille → <span class="no">(–)</span></li>
<li><b>24.11.:</b> Antrag durch G (§ 145) <span class="ok">(+)</span><ul><li>Abgabe <span class="ok">(+)</span></li><li>Zugang (Übergabe unter Anwesenden) <span class="ok">(+)</span></li></ul></li>
<li><b>24.11.:</b> Annahme durch M (§ 147 I) <span class="ok">(+)</span><ul><li>Abgabe <span class="ok">(+)</span></li><li>uneingeschränktes Einverständnis <span class="ok">(+)</span></li><li>Annahmefrist: sofort <span class="ok">(+)</span></li><li>Zugang <span class="ok">(+)</span></li></ul></li>
<li><span class="te">TE: Einigung (+) → Mietvertrag zustande gekommen</span></li></ul></li>
<li><b>Problem: Wirksamkeit – Minderjährigkeit</b>
<ul><li>beschränkte Geschäftsfähigkeit (§§ 2, 106) <span class="ok">(+)</span> → §§ 107 ff.</li>
<li>lediglich rechtlicher Vorteil (§ 107)? Pflicht zur Mietzahlung, Haftung → <span class="no">(–)</span></li>
<li>Einwilligung (§§ 107, 183)? ausdrücklich <span class="no">(–)</span>, schlüssig/§ 110 <span class="no">(–)</span></li>
<li><span class="te">TE: schwebend unwirksam (§ 108 I)</span></li>
<li>Genehmigung (§§ 108 I, 184 I)? Vater verweigert ggü. G (§ 182 I) <span class="no">(–)</span></li>
<li><span class="te">TE: endgültig unwirksam</span></li></ul></li>
<li><span class="te">TE: wirksamer Mietvertrag (–)</span></li></ul></li>
<li><b>Ergebnis:</b> G hat <span class="no">keinen</span> Anspruch gegen M aus § 535 II BGB.</li></ul></li></ul></div></details>
<div class="box merke"><span class="bt">Warum prüft man den 10.11. überhaupt?</span>Weil der Sachverhalt ein Gespräch an diesem Tag schildert. Ein gutes Gutachten zeigt, dass du jede rechtlich mögliche Erklärung gesehen hast – auch wenn sie im Ergebnis keine ist. Unproblematisches darfst du dabei kurz halten.</div>`},

{id:'m1-s9',title:'Das Gutachten schreiben',html:`
<p class="lead">Formuliere das Gutachten in drei Etappen. Schreibe jede Etappe zuerst selbst – erst dann blendest du die Musterlösung ein. Deine Texte werden in deinem Browser gespeichert.</p>
${STEPS_VISUAL}
<div class="w" data-w="m1-write-g1"></div>
<div class="w" data-w="m1-write-g2"></div>
<div class="w" data-w="m1-write-g3"></div>
<h2>Vom Gutachten zur Antwort: der Vermerk an Frau Schön</h2>
<p>Frau Schön braucht kein Gutachten, sondern eine klare Antwort. Für sie schreibst du im <b>Urteilsstil</b>: Ergebnis zuerst, dann kurz die Begründung – verständlich und ohne Fachchinesisch.</p>
<div class="w" data-w="m1-write-vermerk"></div>`},

{id:'m1-s10',title:'Abschlusstest, Checkliste & KI-Prompts',html:`
<p class="lead">Zeit für die Bilanz! Teste dein Wissen zu LS 1, bewerte dein Gutachten mit der Checkliste und vertiefe mit den KI-Prompts, was noch wackelt.</p>
<div class="w" data-w="m1-quiz-final"></div>
<div class="w" data-w="m1-qa-quick"></div>
<div class="w" data-w="m1-check"></div>
<div class="w" data-w="m1-prompts"></div>
<div class="box merke"><span class="bt">Und jetzt?</span>Trage unter <a href="#ziele">Lernziele &amp; Selbsteinschätzung</a> ein, was du sicher kannst. Notiere offene Fragen für den Unterricht. Die nächste Lernsituation („Lena muss schweigen“ – Stellvertretung &amp; Anfechtung) schaltet deine Lehrkraft frei.</div>`}
);
