W['m1-quiz-sv']={type:'quiz',title:'Hast du den Sachverhalt verstanden?',qs:[
{q:'Was geschah am 10.11.?',o:['Max unterschrieb den Mietvertrag.','Max erkundigte sich nach einer Mietmöglichkeit; Frau Schön sagte nichts zu.','Der Vater widersprach dem Vertrag.','Der Schulleiter lehnte die Vermietung ab.'],a:1,e:'Am 10.11. gab es nur eine Erkundigung – Frau Schön wollte erst mit dem Schulleiter sprechen.'},
{q:'Wer hat den Mietvertrag zuerst unterschrieben?',o:['Max','Frau Schön','Der Schulleiter','Der Vater'],a:2,e:'Der Vertrag war „vorab schon vom Schulleiter unterzeichnet“ – das ist für die Frage wichtig, wer den Antrag gemacht hat.'},
{q:'Gegenüber wem hat der Vater seine Ablehnung erklärt?',o:['Gegenüber Max','Gegenüber Frau Schön (also der Schule)','Gegenüber dem Fachdienst Recht','Gegenüber dem Abiturjahrgang'],a:1,e:'Er erklärte es Frau Schön im Büro – also gegenüber der Vertragspartnerin. Das wird bei § 182 I BGB wichtig.'},
{q:'Welche Frage musst du laut Bearbeitungshinweis NICHT prüfen?',o:['Ob Max geschäftsfähig ist','Ob ein Vertrag zustande gekommen ist','Ob Sekretärin und Schulleiter die Schule wirksam vertreten (Stellvertretung)','Ob der Vater zugestimmt hat'],a:2,e:'Stellvertretungsfragen sind ausgeklammert – sie folgen in LS 2.'}]};

W['m1-sort-we']={type:'sort',title:'Gibt Maren eine Willenserklärung ab?',intro:'Entscheide, ob eine Willenserklärung vorliegt – und wenn ja, in welcher Form.',
cats:['WE – ausdrücklich','WE – konkludent','keine WE'],
items:[
{t:'Maren setzt handschriftlich ihr Testament auf.',c:0,fb:'Ausdrückliche, nicht empfangsbedürftige WE.'},
{t:'Maren bucht im Internet einen Flug und klickt auf „zahlungspflichtig buchen“.',c:0,fb:'Ausdrückliche WE in elektronischer Form.'},
{t:'Maren rutscht mit ihrem Auto auf eisglatter Straße und beschädigt ein parkendes Fahrzeug.',c:2,fb:'Kein Wille, eine Rechtsfolge herbeizuführen – ein bloßer Unfall (ggf. Schadensersatz nach Deliktsrecht).'},
{t:'Maren nimmt für ihren Nachbarn ein Paket an.',c:2,fb:'Reine Gefälligkeit/tatsächliche Handlung ohne Rechtsbindungswillen.'},
{t:'Maren kündigt schriftlich ihren Arbeitsvertrag.',c:0,fb:'Ausdrückliche, empfangsbedürftige WE.'},
{t:'Maren legt im Supermarkt eine Packung Kaffee wortlos aufs Kassenband.',c:1,fb:'Schlüssiges Verhalten: Sie will den Kaffee kaufen.'},
{t:'Maren wirft am Parkscheinautomaten Münzen ein und drückt die Taste.',c:1,fb:'Konkludente WE.'},
{t:'Maren bekommt per Post ein Zeitschriften-Probeabo angeboten und reagiert einfach nicht.',c:2,fb:'Schweigen ist grundsätzlich keine Willenserklärung.'},
{t:'Maren bewegt im Schlaf den Arm und drückt dabei auf ihrem Tablet auf „Bestellen“.',c:2,fb:'Es fehlt der Handlungswille – keine WE.'}]};

W['m1-quiz-zugang']={type:'quiz',title:'Selbsttest: Abgabe & Zugang',qs:[
{q:'Ein Brief an die Stadtverwaltung wird am Dienstag um 22:00 Uhr in den Behördenbriefkasten geworfen. Wann geht er zu?',o:['Dienstag, 22:00 Uhr','Mittwoch zu Dienstbeginn','Wenn die Sachbearbeiterin ihn liest','Erst nach Eingangsstempel und Weiterleitung'],a:1,e:'Außerhalb der Dienstzeit ist erst mit Beginn der nächsten Dienstzeit mit der Kenntnisnahme zu rechnen.'},
{q:'Händler K bietet ein Buch nur „im November“ an und fährt am 30.11. frühmorgens für eine Woche weg. M wirft seine Bestellung am 30.11. um 19:00 Uhr in den Geschäftsbriefkasten. Ist die Bestellung im November zugegangen?',o:['Ja, Einwurf am 30.11. genügt.','Nein – nach Geschäftsschluss ist erst am nächsten Geschäftstag (01.12.) mit Kenntnisnahme zu rechnen.','Nein, weil K verreist ist – Zugang erst bei seiner Rückkehr.','Ja, weil K den Zugang vereitelt hat.'],a:1,e:'Um 19:00 Uhr ist nach der Verkehrsanschauung nicht mehr mit einer Leerung des Geschäftsbriefkastens zu rechnen. Die Reise des K spielt keine Rolle – Zugang wird abstrakt beurteilt.'},
{q:'Eine Bestellkarte liegt um 9:00 Uhr in der Posteingangsstelle eines Versandhauses. Um 11:00 Uhr ruft der Kunde an und widerruft. Die Karte wurde noch nicht gelesen. Ist der Widerruf wirksam?',o:['Ja, weil die Karte noch nicht gelesen wurde.','Nein – der Widerruf muss vorher oder gleichzeitig zugehen (§ 130 I 2 BGB); die Bestellung war um 9:00 Uhr schon zugegangen.','Ja, telefonische Erklärungen gehen immer vor.','Nein, ein Widerruf ist nie möglich.'],a:1,e:'Es kommt auf den Zugang an, nicht auf das tatsächliche Lesen.'},
{q:'Wann wird ein Testament wirksam?',o:['Mit Zugang beim Erben','Mit der Abgabe – es ist nicht empfangsbedürftig','Mit Eröffnung durch das Nachlassgericht','Mit Zugang beim Notar'],a:1,e:'Nicht empfangsbedürftige WE werden schon mit der Abgabe wirksam (die erbrechtliche Wirkung tritt natürlich erst mit dem Erbfall ein).'},
{q:'Ein Mitarbeiter versteckt sich wochenlang, damit ihm die Kündigung nicht übergeben werden kann. Folge?',o:['Kündigung geht nie zu','Er muss sich so behandeln lassen, als sei die Kündigung rechtzeitig zugegangen (§ 242 BGB)','Kündigung ist nichtig','Arbeitgeber muss erneut kündigen'],a:1,e:'Grundlose Zugangsvereitelung ist nach Treu und Glauben unbeachtlich.'},
{q:'Welche Aussage zur Erklärung am Telefon stimmt?',o:['Sie gilt als Erklärung unter Abwesenden.','Sie wird wie eine Erklärung unter Anwesenden behandelt (§ 147 I 2 BGB).','Sie ist nur wirksam, wenn sie schriftlich bestätigt wird.','Sie wird erst mit dem Auflegen wirksam.'],a:1,e:'Telefonische Erklärungen werden wie Erklärungen unter Anwesenden behandelt.'}]};

W['m1-quiz-aa']={type:'quiz',title:'Selbsttest: Antrag & Annahme',qs:[
{q:'Ein Elektromarkt wirbt im Prospekt: „Laptop X nur 499 €!“. Was ist das rechtlich?',o:['Ein Antrag an alle Leser','Eine Annahme','Eine Aufforderung zur Abgabe von Anträgen (invitatio ad offerendum)','Eine nicht empfangsbedürftige WE'],a:2,e:'Der Händler will sich nicht gegenüber unbestimmt vielen Personen binden – der Antrag kommt vom Kunden.'},
{q:'Welche Bestandteile muss ein Antrag beim Kaufvertrag mindestens enthalten?',o:['Vertragsparteien, Kaufsache, Kaufpreis','Lieferdatum, Zahlungsziel, Skonto','Unterschrift und Datum','AGB und Widerrufsbelehrung'],a:0,e:'Die wesentlichen Vertragsbestandteile: Parteien, Leistung, Gegenleistung.'},
{q:'Ein Antrag wird am Telefon gemacht. Bis wann kann er angenommen werden?',o:['Innerhalb einer Woche','Nur sofort, also solange das Telefonat andauert (§ 147 I 2 BGB)','Bis zum Ende des Tages','Innerhalb von zwei Wochen'],a:1,e:'Telefonische Anträge gelten als Anträge unter Anwesenden.'},
{q:'Die Stadt antwortet auf ein Angebot: „Einverstanden, aber mit 5 % Rabatt.“ Folge?',o:['Annahme – der Vertrag gilt mit Rabatt','Annahme – der Vertrag gilt ohne Rabatt','Ablehnung mit Änderung = neuer Antrag (§ 150 II BGB)','Die Erklärung ist nichtig'],a:2,e:'Eine Annahme unter Änderungen ist keine Annahme, sondern ein neuer Antrag.'},
{q:'Ein Angebot ist „gültig bis 08.12.“. Die Bestellung geht am 09.12. zu. Folge?',o:['Vertrag ist geschlossen','Die verspätete Annahme gilt als neuer Antrag (§ 150 I BGB)','Der Antragende muss die Verspätung anzeigen','Der Vertrag ist anfechtbar'],a:1,e:'Die Frist des § 148 BGB ist abgelaufen; die Bestellung ist nur ein neuer Antrag.'},
{q:'Wann greift § 149 BGB?',o:['Wenn die Annahme zu spät abgeschickt wurde','Wenn die Annahme rechtzeitig abgeschickt wurde, durch einen unregelmäßigen Transport verspätet ankommt und der Antragende das erkennen muss','Wenn der Antragende minderjährig ist','Wenn die Annahme Änderungen enthält'],a:1,e:'Dann muss der Antragende die Verspätung unverzüglich anzeigen – sonst gilt die Annahme als rechtzeitig.'},
{q:'Was passiert mit einem Antrag, den der Empfänger ablehnt?',o:['Er bleibt bestehen','Er erlischt (§ 146 BGB)','Er wird zur Annahme','Er wird schwebend unwirksam'],a:1,e:'§ 146 Alt. 1 BGB: Der Antrag erlischt mit der Ablehnung.'}]};

W['m1-sort-faelle']={type:'sort',title:'Ist ein Vertrag zustande gekommen?',intro:'Ordne jeden Fall zu. Die Details findest du in den Lösungsskizzen oben.',
cats:['Ja, Vertrag (+)','Nein, Vertrag (–)'],
items:[
{t:'<b>Fall A:</b> Stadt bestellt Papier zu den Preisen aus einem Werbeflyer; der Händler antwortet „ausverkauft“.',c:1,fb:'Flyer = invitatio; die Bestellung (Antrag) wurde abgelehnt.'},
{t:'<b>Fall B:</b> Telefonisches Angebot wird abgelehnt; 20 Minuten später ruft der Sachbearbeiter zurück und will bestellen – das Gerät ist verkauft.',c:1,fb:'Der Antrag ist durch die Ablehnung erloschen (§ 146); der Rückruf ist ein neuer Antrag, der nicht angenommen wird.'},
{t:'<b>Fall C:</b> Angebot „gültig bis 08.12.“; Bestellung der Stadt am 09.12.',c:1,fb:'Verspätete Annahme = neuer Antrag (§ 150 I).'},
{t:'<b>Fall D:</b> Händler lehnt ab, bietet aber anderes Papier an; die Stadt bestellt dieses zu den genannten Konditionen.',c:0,fb:'Neuer Antrag nach § 150 II + rechtzeitige Annahme der Stadt.'},
{t:'<b>Fall E:</b> Annahme wird rechtzeitig abgeschickt, kommt wegen einer Postverzögerung zu spät an; das Museum zeigt die Verspätung nicht an.',c:0,fb:'§ 149 S. 2: Die Annahme gilt als nicht verspätet.'}]};

W['m1-sort-gf']={type:'sort',title:'Wirksam oder nicht?',intro:'Entscheide, wie es um die Wirksamkeit des Vertrages steht.',
cats:['wirksam','schwebend unwirksam','endgültig unwirksam / nichtig'],
items:[
{t:'Die 6-jährige Lina kauft am Kiosk ein Eis für 1,50 € und zahlt mit ihrem Taschengeld.',c:2,fb:'Lina ist geschäftsunfähig (§ 104 Nr. 1) – ihre WE ist nichtig (§ 105 I). § 110 gilt nur für beschränkt Geschäftsfähige!'},
{t:'Der 16-jährige Tim bekommt von seiner Tante ein Fahrrad geschenkt.',c:0,fb:'Die Schenkung ist lediglich rechtlich vorteilhaft (§ 107).'},
{t:'Die 15-jährige Sara kauft von ihrem Taschengeld ein Buch für 12 € und zahlt sofort bar.',c:0,fb:'§ 110: Leistung mit überlassenen Mitteln vollständig bewirkt.'},
{t:'Der 17-jährige Jonas kauft ohne Wissen seiner Eltern ein Handy für 600 € auf Raten.',c:1,fb:'Weder Einwilligung noch § 110 (Raten = nicht vollständig bewirkt) → § 108 I.'},
{t:'Wie bei Jonas – aber die Eltern erklären später dem Händler, sie seien nicht einverstanden.',c:2,fb:'Genehmigung verweigert → endgültig unwirksam.'},
{t:'Die Eltern der 17-jährigen Mia erlauben ihr vorher, sich ein bestimmtes E-Bike für 900 € zu kaufen. Mia kauft es.',c:0,fb:'Einwilligung (§§ 107, 183).'},
{t:'Der 19-jährige Paul schließt einen Handyvertrag ab.',c:0,fb:'Volljährig, § 2 – voll geschäftsfähig.'}]};

W['m1-write-roller']={type:'write',cmp:'Stimmt deine Prüfungsreihenfolge? Hast du bei Antrag und Annahme Abgabe und Zugang geprüft und jedes Teilergebnis mit (+) oder (–) gekennzeichnet?',title:'Übungsfall: Der Roller',task:'<p><b>Sachverhalt:</b> Lukas (17) hat ständig Geldsorgen. Er verkauft seinen Roller für 650 € an seinen Freund Markus (17). Markus bittet mittags seine Eltern, ihm das Geld zur Verfügung zu stellen – die Eltern weigern sich, sie sind mit dem Kauf nicht einverstanden. Lukas regt sich auf: Die Eltern hätten damit nichts zu tun. Er fordert die 650 €.</p><p><b>Aufgabe:</b> Hat Lukas (L) gegen Markus (M) einen Anspruch auf Zahlung des Kaufpreises? Erstelle eine Lösungsskizze.</p>',
hint:'Wer will was von wem woraus? Der Verkäufer will den Kaufpreis …',
sol:`<div class="tree"><ul><li>L könnte von M die Zahlung des Kaufpreises i. H. v. 650 € gem. § 433 II BGB verlangen.
<ul><li><b>I. Anspruch entstanden?</b> – wirksamer Kaufvertrag
<ul><li>Antrag (§ 145) <span class="ok">(+)</span>: Abgabe <span class="ok">(+)</span>, Zugang <span class="ok">(+)</span></li><li>Annahme (§ 147) <span class="ok">(+)</span>: Abgabe <span class="ok">(+)</span>, Zugang <span class="ok">(+)</span></li><li><span class="te">TE: Einigung (+)</span></li>
<li>Problem: Minderjährigkeit des M
<ul><li>beschränkte Geschäftsfähigkeit (§ 106) <span class="ok">(+)</span></li>
<li>lediglich rechtlicher Vorteil (§ 107)? Zahlungspflicht → <span class="no">(–)</span></li>
<li>Einwilligung (§ 183): ausdrücklich <span class="no">(–)</span>, § 110 <span class="no">(–)</span></li>
<li><span class="te">TE: schwebend unwirksam (§ 108 I)</span></li>
<li>Genehmigung (§ 184 I)? Eltern verweigern <span class="no">(–)</span> → endgültig unwirksam</li></ul></li>
<li><span class="te">TE: wirksamer KV (–)</span></li></ul></li>
<li><b>Ergebnis:</b> L kann von M die Zahlung von 650 € nicht verlangen.</li></ul></li></ul></div>
<div class="box info" style="font-size:.9rem"><span class="bt">Für Profis</span>Auch Lukas ist 17 – sein Verkauf ist für ihn ebenfalls nicht lediglich rechtlich vorteilhaft (er muss den Roller übereignen). Da der Vertrag schon an der fehlenden Genehmigung durch die Eltern des Markus scheitert, kommt es darauf aber nicht mehr an.</div>`};

W['m1-frist']={type:'frist',title:'Fristen selbst berechnen',intro:'Probiere verschiedene Fälle aus – z. B. die Zwei-Wochen-Frist des § 108 II BGB oder eine Monatsfrist zum Monatsende. Der Rechner zeigt dir jeden Rechenschritt mit Norm.'};

W['m1-quiz-frist']={type:'quiz',title:'Selbsttest: Fristen',qs:[
{q:'Ein Angebot geht der Stadt am Mittwoch, 05.11., zu: „Sie können innerhalb von zwei Wochen annehmen.“ Wann endet die Frist?',o:['Dienstag, 18.11., 24:00 Uhr','Mittwoch, 19.11., 24:00 Uhr','Donnerstag, 20.11., 24:00 Uhr','Freitag, 21.11., 24:00 Uhr'],a:1,e:'Ereignistag zählt nicht mit (§ 187 I); Ende am gleichnamigen Wochentag (§ 188 II).'},
{q:'Ereignistag 30.01. (kein Schaltjahr), Frist ein Monat. Fristende?',o:['28.02.','01.03.','02.03.','30.02.'],a:0,e:'Den 30.02. gibt es nicht → § 188 III BGB: letzter Tag des Monats.'},
{q:'Das rechnerische Fristende fällt auf einen Samstag. Was gilt?',o:['Die Frist endet am Freitag davor.','Die Frist endet am Samstag.','Die Frist endet am nächsten Werktag (§ 193 BGB).','Die Frist verlängert sich um eine Woche.'],a:2,e:'§ 193 BGB schützt vor Fristablauf am Wochenende oder Feiertag.'},

W['m1-write-vermerk']={type:'write',cmp:'Steht das Ergebnis am Anfang (Urteilsstil)? Ist deine Antwort für Frau Schön verständlich und beantwortet sie auch die Frage nach dem Aulaschlüssel?',title:'Antwort an Frau Schön (Urteilsstil)',task:'<p>Schreibe Frau Schön eine kurze Antwort (4–6 Sätze): Ist der Vertrag wirksam? Was sagt sie Max, wenn er um den Schlüssel bittet?</p>',hint:'Ergebnis zuerst! Verständliche Sprache, Normen nur sparsam.',
sol:'<div class="doc" style="font-size:.93rem"><b>Ihr Vermerk vom 01.12.20.. – Anmietung der Aula für das Abi-Varieté</b><br><br>Sehr geehrte Frau Schön,<br><br>der Mietvertrag mit Max Mustermann ist <b>nicht wirksam</b>. Max ist mit 17 Jahren beschränkt geschäftsfähig. Weil er sich mit dem Vertrag zur Zahlung der Miete von 150 € und zur Haftung für Schäden verpflichtet, brauchte er die Zustimmung seiner Eltern (§§ 106, 107 BGB). Diese lag beim Vertragsschluss nicht vor; der Vertrag war daher zunächst schwebend unwirksam (§ 108 I BGB). Da Herr Mustermann Ihnen gegenüber die Genehmigung ausdrücklich verweigert hat, ist der Vertrag endgültig unwirksam.<br><br>Max hat deshalb keinen Anspruch auf Überlassung der Aula – den Schlüssel müssen Sie ihm nicht aushändigen. Möchte der Jahrgang die Aula weiterhin mieten, kann z. B. ein volljähriger Schüler oder die Elternvertretung einen neuen Vertrag schließen; alternativ müssten Max’ Eltern zustimmen.<br><br>Mit freundlichen Grüßen<br>i. A. [Name], FD Recht</div>'};

W['m1-quiz-final']={type:'quiz',title:'Abschlusstest LS 1',qs:[
{q:'Wodurch kommt ein Vertrag zustande?',o:['Durch Unterschrift beider Parteien','Durch zwei übereinstimmende Willenserklärungen – Antrag und Annahme','Durch Übergabe der Ware','Durch Zahlung'],a:1,e:'Einigung durch Antrag und Annahme (§§ 145 ff. BGB). Eine Unterschrift ist nur eine Form der Erklärung.'},
{q:'Welche Anspruchsgrundlage nutzt die Schule, wenn sie von Max die Miete verlangt?',o:['§ 433 II BGB','§ 535 I 1 BGB','§ 535 II BGB','§ 145 BGB'],a:2,e:'Der Vermieter verlangt die Miete → § 535 II BGB.'},
{q:'Warum liegt am 10.11. kein Antrag des Max vor?',o:['Weil Max minderjährig ist','Weil die Miete nicht genannt wurde und Max sich nur erkundigen wollte','Weil er nicht schriftlich gefragt hat','Weil Frau Schön nicht zuständig war'],a:1,e:'Es fehlen ein wesentlicher Vertragsbestandteil und der Rechtsbindungswille.'},
{q:'Wer macht am 24.11. den Antrag?',o:['Max','Die Schule (G) durch Vorlage des vom Schulleiter unterschriebenen Vertrages','Der Vater','Niemand'],a:1,e:'Der vorbereitete und bereits unterschriebene Vertrag enthält alle wesentlichen Bestandteile – Max muss nur noch „Ja“ sagen.'},
{q:'Was bedeutet „schwebend unwirksam“?',o:['Der Vertrag ist von Anfang an nichtig.','Der Vertrag ist wirksam, kann aber angefochten werden.','Die Wirksamkeit hängt noch von der Genehmigung der gesetzlichen Vertreter ab.','Der Vertrag ist nur für eine Partei bindend.'],a:2,e:'§ 108 I BGB: Mit Genehmigung wird er (rückwirkend) wirksam, mit Verweigerung endgültig unwirksam.'},
{q:'Warum ändert die Aussage „der Jahrgang zahlt alle Kosten“ nichts an der Zustimmungsbedürftigkeit?',o:['Weil der Jahrgang nicht rechtsfähig ist','Weil es bei § 107 BGB nur auf rechtliche Pflichten ankommt – Max bleibt selbst Schuldner der Miete','Weil 150 € zu viel sind','Weil die Schule das Geld nicht annehmen darf'],a:1,e:'Wirtschaftliche Erwägungen spielen bei § 107 BGB keine Rolle.'},
{q:'Warum greift § 110 BGB im Fall nicht?',o:['Max hat die Miete noch nicht bezahlt, und das Geld stammt nicht aus Mitteln, die ihm die Eltern überlassen haben','Max ist zu jung','§ 110 gilt nur für Kaufverträge','Weil der Vater widersprochen hat'],a:0,e:'§ 110 verlangt, dass die Leistung mit überlassenen Mitteln bewirkt wird.'},
{q:'Konnte der Vater die Genehmigung gegenüber Frau Schön verweigern?',o:['Nein, nur gegenüber Max','Ja – Genehmigung bzw. Verweigerung kann gegenüber dem Minderjährigen oder dem Vertragspartner erklärt werden (§ 182 I BGB)','Nein, nur schriftlich','Nein, nur vor Gericht'],a:1,e:'§ 182 I BGB lässt beide Adressaten zu.'},
{q:'Was unterscheidet Einwilligung und Genehmigung?',o:['Einwilligung ist schriftlich, Genehmigung mündlich','Einwilligung = vorherige, Genehmigung = nachträgliche Zustimmung','Es gibt keinen Unterschied','Einwilligung gibt das Gericht, Genehmigung die Eltern'],a:1,e:'§ 183 S. 1 und § 184 I BGB.'},
{q:'Ein 6-jähriges Kind kauft mit Taschengeld ein Eis. Rechtslage?',o:['Wirksam nach § 110 BGB','Schwebend unwirksam','Nichtig, da das Kind geschäftsunfähig ist (§§ 104 Nr. 1, 105 I BGB)','Wirksam, weil lediglich rechtlich vorteilhaft'],a:2,e:'§ 110 gilt nur für beschränkt Geschäftsfähige ab 7 Jahren.'},
{q:'Eine Annahme mit Änderungen ist …',o:['eine wirksame Annahme','eine Ablehnung mit Änderung = neuer Antrag (§ 150 II BGB)','nichtig','schwebend unwirksam'],a:1,e:'§ 150 II BGB.'},
{q:'Wann geht eine E-Mail an eine Behörde zu, die am Dienstag um 10:15 Uhr eingeht?',o:['Wenn sie gelesen wird','Sofort mit Eingang im Postfach während der Dienstzeit','Am nächsten Tag','Wenn eine Lesebestätigung verschickt wird'],a:1,e:'Während der Geschäftszeit ist sofort mit Kenntnisnahme zu rechnen.'},
{q:'Welches Ergebnis hat das Gutachten im Fall „Theater mit dem Vater“?',o:['Die Schule hat einen Anspruch auf 150 €.','Der Vertrag ist wirksam, aber anfechtbar.','Die Schule hat keinen Anspruch – der Vertrag ist endgültig unwirksam.','Max muss die Hälfte zahlen.'],a:2,e:'Genehmigung verweigert → endgültig unwirksam → kein Anspruch aus § 535 II BGB.'}]};

W['m1-prompts']={type:'prompts',title:'KI-Lernprompts zu LS 1',items:[
{t:'Sokratischer Tutor: Geschäftsfähigkeit',when:'Wenn §§ 106–110 BGB noch wackeln',p:`Du bist ein sokratischer Tutor für Zivilrecht. Ich bin Auszubildende/r zur/zum Verwaltungsfachangestellten (1. Ausbildungsjahr, Niedersachsen, Lernfeld 4).
Thema: Geschäftsfähigkeit Minderjähriger (§§ 104–113 BGB), insbesondere § 107 (lediglich rechtlicher Vorteil), § 108 (schwebende Unwirksamkeit, Genehmigung), § 110 (Taschengeldparagraf), §§ 182–184 (Einwilligung/Genehmigung).
Erkläre mir nichts vorab. Stelle mir stattdessen nacheinander Fragen und kurze Fälle, mit denen ich mir die Regeln selbst erarbeite. Gib mir Hinweise, wenn ich falsch liege, aber verrate die Lösung erst nach meinem zweiten Versuch. Beginne mit einer leichten Frage.`},
{t:'Neuer Übungsfall im Stil von LS 1',when:'Zum Üben nach dem Fall „Theater mit dem Vater“',p:`Erstelle mir einen neuen, kurzen Übungsfall aus einer Kommunalverwaltung in Niedersachsen (z. B. Vermietung eines Gemeindesaals, Verkauf eines ausgemusterten Dienstgegenstands).
Der Fall soll folgende Prüfungspunkte enthalten: Antrag (§ 145 BGB), Zugang (§ 130 BGB), Annahme (§§ 146–150 BGB) und ein Problem mit der beschränkten Geschäftsfähigkeit eines Minderjährigen (§§ 106–110 BGB).
Gib mir zuerst NUR den Sachverhalt als Aktenvermerk. Wenn ich meine Lösungsskizze schicke, vergleiche sie mit deiner Musterlösung und gib mir Feedback zu Struktur, Normen und Ergebnis.`},
{t:'Gutachten-Feedback mit Checkliste',when:'Nachdem du Etappe 1–3 geschrieben hast',p:`Du bist Lehrkraft für Zivilrecht an einer Berufsschule. Bewerte mein Gutachten zum folgenden Fall anhand dieser Kriterien:
1) Obersatz mit allen W-Fragen (Wer? Will was? Von wem? Warum? Woraus?)
2) 4-Schritt-Methode bei jedem Tatbestandsmerkmal (TBM mit Sachverhaltsbezug – Definition – Subsumtion – Conclusio)
3) keine abgeschriebenen Gesetzestexte bei der Definition
4) Konjunktiv/Gutachtenstil
5) Problemschwerpunkt (Geschäftsfähigkeit) ausführlich, Unproblematisches kurz
6) exakte Zitierweise der Normen.
Gib zu jedem Kriterium „erfüllt / vage / fehlt“ und einen konkreten Verbesserungstipp mit Textbeispiel aus meinem Gutachten. Schreibe mein Gutachten nicht komplett neu.

Sachverhalt: Max (17) unterschreibt am 24.11. einen vom Schulleiter bereits unterschriebenen Mietvertrag über die Schulaula (Miete 150 €, Haftung für Schäden). Am 10.11. hatte er sich nur nach der Mietmöglichkeit erkundigt. Am 01.12. erklärt sein Vater gegenüber der Schulsekretärin, er sei nicht einverstanden und die Unterschrift sei ungültig.
Mein Gutachten: [hier einfügen]`},
{t:'Erklär mir das wie einer Freundin',when:'Für den schnellen Überblick vor einer Klausur',p:`Erkläre mir in einfacher Sprache und mit Beispielen aus dem Alltag einer Stadtverwaltung:
- den Unterschied zwischen Antrag und invitatio ad offerendum,
- die Annahmefristen (§§ 147, 148 BGB) und die Sonderfälle §§ 149, 150 BGB,
- wann eine Willenserklärung zugeht (§ 130 BGB).
Fasse alles am Ende in einer kurzen Merkliste (max. 10 Punkte) zusammen und stelle mir dann 3 Kontrollfragen.`},
{t:'Fristen-Training',when:'Wenn du Fristberechnung üben willst',p:`Gib mir nacheinander 5 Aufgaben zur Fristberechnung nach §§ 187, 188, 193 BGB (Tages-, Wochen- und Monatsfristen, auch Monatsende und Wochenende). Nenne jeweils den Ereignistag mit Wochentag. Ich berechne Fristbeginn und Fristende mit Normangabe. Prüfe meine Lösung und erkläre Fehler Schritt für Schritt, bevor du die nächste Aufgabe stellst. Feiertage bitte vermeiden.`}]};

/* für LS 2 vorgemerkt: Stellvertretung QA+'/quiz/46380', Anfechtung QA+'/quiz/46382' */
/* ---------- Modulliste (Freigabe durch Lehrkraft) ---------- */
const MODULES=[M0,M1,
{id:'m2',short:'LS 2 · Lena muss schweigen',title:'Lernsituation 2 · „Lena muss schweigen“',released:false,teaser:'Stellvertretung und Anfechtung von Willenserklärungen'},
{id:'m3',short:'LS 3 · Autokauf',title:'Lernsituation 3 · „Autokauf“',released:false,teaser:'Folgt nach Freigabe'},
{id:'m4',short:'LS 4 · Drucker',title:'Lernsituation 4 · „Drucker“',released:false,teaser:'Folgt nach Freigabe'}];

/* ================= ENGINE ================= */
const KEY='lw-zivil-lf4-v1';
let S={read:{},quiz:{},sort:{},cl:{},wr:{},goals:{},ext:{},name:''};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r));}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>el.classList.remove('show'),2200);}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const TRACK=['quiz','sort','check','write','ext'];
function widgetsIn(sec){const ids=[];(sec.html||'').replace(/data-w="([^"]+)"/g,(m,id)=>{ids.push(id)});return ids;}
function wDone(id){const w=W[id];if(!w)return 0;
  if(w.type==='quiz'){const b=(S.quiz[id]||{}).best||0;return b>=0.7?1:b;}
  if(w.type==='sort'){const b=(S.sort[id]||{}).best||0;return b>=0.8?1:b;}
  if(w.type==='check'){const c=S.cl[id]||{};return Object.keys(c).length/w.items.length;}
  if(w.type==='write'){return ((S.wr[id]||'').trim().length>=80)?1:0;}
  if(w.type==='ext'){const e=(S.ext||{})[id];return e&&e.done?1:0;}
  return 0;}
function modProgress(m){if(!m.released)return null;let tot=0,sum=0;
  m.sections.forEach(s=>{tot++;sum+=S.read[s.id]?1:0;widgetsIn(s).forEach(id=>{if(W[id]&&TRACK.includes(W[id].type)){tot++;sum+=wDone(id);}});});
  return tot?sum/tot:0;}
function allQuizzes(){const out=[];MODULES.forEach(m=>{if(!m.released)return;m.sections.forEach(s=>widgetsIn(s).forEach(id=>{const w=W[id];if(w&&(w.type==='quiz'||w.type==='sort'||w.type==='ext'))out.push({m,s,id,w});}));});return out;}

/* ---------- navigation ---------- */
function renderNav(cur){
  let h='<div class="navgroup">Übersicht</div>';
  h+=`<div class="navmod ${cur==='start'?'active':''}"><button onclick="go('start')">📊 <span>Mein Lern-Dashboard</span></button></div>`;
  h+=`<div class="navmod ${cur==='ziele'?'active':''}"><button onclick="go('ziele')">🎯 <span>Lernziele &amp; Selbsteinschätzung</span></button></div>`;
  h+='<div class="navgroup">Lernmodule</div>';
  MODULES.forEach(m=>{
    const isCur=m.sections&&m.sections.some(s=>s.id===cur);
    if(!m.released){h+=`<div class="navmod locked"><button title="Wird von deiner Lehrkraft freigeschaltet">🔒 <span>${m.short}</span></button></div>`;return;}
    const p=Math.round(modProgress(m)*100);
    h+=`<div class="navmod ${isCur?'open active':''}"><button onclick="toggleMod(this,'${m.sections[0].id}')">${m.icon} <span>${m.short}</span><span class="pct">${p}%</span></button><div class="navsub">`;
    m.sections.forEach(s=>{h+=`<button class="navlink ${s.id===cur?'cur':''} ${S.read[s.id]?'done':''}" onclick="go('${s.id}')"><span class="dot"></span>${s.title}</button>`;});
    h+='</div></div>';
  });
  document.getElementById('nav').innerHTML=h;
}
function toggleMod(btn,first){const el=btn.parentElement;if(el.classList.contains('open')){el.classList.remove('open');}else{go(first);}}
function go(id){location.hash=id;}
function findSec(id){for(const m of MODULES){if(!m.released)continue;const i=m.sections.findIndex(s=>s.id===id);if(i>=0)return{m,i,s:m.sections[i]};}return null;}
function route(){
  const id=(location.hash||'#start').slice(1)||'start';
  document.getElementById('side').classList.remove('open');
  const c=document.getElementById('content');
  if(id==='start'){c.innerHTML=renderDashboard();renderNav('start');}
  else if(id==='ziele'){c.innerHTML=renderGoals();renderNav('ziele');}
  else{const f=findSec(id);if(!f){location.hash='start';return;}
    const {m,i,s}=f;const prev=m.sections[i-1],next=m.sections[i+1];
    c.innerHTML=`<div class="crumb">${m.title} · Abschnitt ${i+1} von ${m.sections.length}</div><h1>${s.title}</h1>${s.html}
    <div class="readbar ${S.read[s.id]?'done':''}" id="rb"><div><b>${S.read[s.id]?'✓ Abschnitt erledigt':'Fertig mit diesem Abschnitt?'}</b><div class="mini">Markiere den Abschnitt, wenn du ihn durchgearbeitet hast – das zählt für dein Dashboard.</div></div>
    <button class="btn ${S.read[s.id]?'sec':'teal'}" onclick="markRead('${s.id}')">${S.read[s.id]?'Markierung entfernen':'Als erledigt markieren'}</button></div>
    <div class="pager">${prev?`<button class="btn sec" onclick="go('${prev.id}')">← ${prev.title}</button>`:'<span></span>'}${next?`<button class="btn" onclick="go('${next.id}')">${next.title} →</button>`:`<button class="btn" onclick="go('start')">Zum Dashboard →</button>`}</div>`;
    renderNav(id);}
  c.querySelectorAll('[data-w]').forEach(el=>mountWidget(el,el.dataset.w));
  window.scrollTo(0,0);
}

function mFrist(el,id,w){const today=new Date().toISOString().slice(0,10);
  const h=`<p>${w.intro||''}</p><div class="calc"><div><label>Ereignistag (z. B. Zugang)</label><input type="date" id="fr-d" value="${today}"></div>
  <div><label>Fristlänge</label><input type="number" id="fr-n" value="2" min="1" max="60"></div>
  <div><label>Einheit</label><select id="fr-u"><option value="d">Tage</option><option value="w" selected>Wochen</option><option value="m">Monate</option></select></div></div>
  <div class="btnrow"><button class="btn" onclick="calcFrist()">Frist berechnen</button></div><div class="calcout" id="fr-out">Wähle Ereignistag und Fristlänge.</div>`;
  el.innerHTML=shell(w,h,'');}
const WT=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
function fmt(d){return WT[d.getDay()]+', '+String(d.getDate()).padStart(2,'0')+'.'+String(d.getMonth()+1).padStart(2,'0')+'.'+d.getFullYear();}
function calcFrist(){const v=document.getElementById('fr-d').value;if(!v)return;const [y,mo,da]=v.split('-').map(Number);const ev=new Date(y,mo-1,da);
  const n=+document.getElementById('fr-n').value;const u=document.getElementById('fr-u').value;let end;let rule='';
  const start=new Date(y,mo-1,da+1);
  if(u==='d'){end=new Date(y,mo-1,da+n);rule='§ 188 I BGB: Eine nach Tagen bestimmte Frist endet mit dem Ablauf des letzten Tages der Frist.';}
  else if(u==='w'){end=new Date(y,mo-1,da+7*n);rule='§ 188 II Alt. 1 BGB: Die Frist endet mit Ablauf des Tages der letzten Woche, der durch seine Benennung (Wochentag) dem Ereignistag entspricht.';}
  else{let tm=mo-1+n;let ty=y+Math.floor(tm/12);tm=tm%12;const last=new Date(ty,tm+1,0).getDate();end=new Date(ty,tm,Math.min(da,last));
    rule='§ 188 II Alt. 1 BGB: Die Frist endet mit Ablauf des Tages des letzten Monats, der durch seine Zahl dem Ereignistag entspricht.'+(da>last?' Diesen Tag gibt es im Endmonat nicht → § 188 III BGB: Fristende ist der letzte Tag des Monats.':'');}
  let fin=new Date(end);let note='';
  while(fin.getDay()===0||fin.getDay()===6){fin.setDate(fin.getDate()+1);}
  if(fin.getTime()!==end.getTime())note=`<li><b>§ 193 BGB:</b> Das rechnerische Fristende (${fmt(end)}) fällt auf ein Wochenende → die Frist endet erst am nächsten Werktag.</li>`;
  document.getElementById('fr-out').innerHTML=`<ol style="margin:0;padding-left:20px">
  <li><b>Ereignistag:</b> ${fmt(ev)} – wird nach <b>§ 187 I BGB</b> nicht mitgezählt.</li>
  <li><b>Fristbeginn:</b> ${fmt(start)} (0:00 Uhr)</li>
  <li><b>Fristende:</b> ${rule} → rechnerisch <b>${fmt(end)}</b>, 24:00 Uhr.</li>${note}
  <li><b>Ergebnis:</b> Die Frist endet mit Ablauf von <b>${fmt(fin)}</b>.</li></ol>
  <p class="mini" style="margin-bottom:0">Hinweis: Gesetzliche Feiertage (§ 193 BGB) berücksichtigt der Rechner nicht – prüfe sie selbst im Kalender für Niedersachsen.</p>`;}
